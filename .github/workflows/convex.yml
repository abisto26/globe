# Uploads the leaderboard functions in convex/ to Convex whenever they change.
# Needs the repository secret CONVEX_DEPLOY_KEY (a Production deploy key from the Convex dashboard).
name: Deploy leaderboard to Convex
on:
  push:
    branches: [main]
    paths: ["convex/**", "package.json", "package-lock.json", ".github/workflows/convex.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx convex deploy -y
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      # Ask the live leaderboard for a board, the same way the game does from the site.
      - name: Check the live leaderboard answers
        run: |
          URL=$(node -p "require('./site.config.json').convexUrl")
          RES=$(curl -sS -i -X POST "$URL/api/query" \
            -H "Content-Type: application/json" -H "Origin: https://abistoufisbot.github.io" \
            -d '{"path":"scores:board","args":{"board":"flags_easy"},"format":"json"}')
          echo "$RES"
          echo "$RES" | grep -qi '^access-control-allow-origin' || { echo "no CORS header"; exit 1; }
          echo "$RES" | grep -q '"status":"success"' || { echo "query failed"; exit 1; }
