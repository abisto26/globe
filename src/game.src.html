<title>Globe by Abisto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game. Prompt bar on top, full-bleed map, action tray at the bottom. */
:root{
  --ocean:#8fc6ea; --ocean-line:#7ab8e0; --chip:#e9f1f5;
  --land:#f6f0dc; --land-edge:#b3a378; --land-hover:#ece0b8;
  --ink:#16323b; --ink-soft:#4f6b74;
  --panel:#ffffff; --panel-edge:#d6e2e5;
  --pin:#d6402b; --target:#1f8a5b; --gold:#c98a12;
  --btn:#16323b; --btn-ink:#f6fbfc;
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(20,60,90,.18), inset 0 1px 0 rgba(255,255,255,.6);
  --display:"Bricolage Grotesque", "IBM Plex Sans Arabic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, "SF Mono", Menlo, monospace;
  --sp-bg:rgba(255,255,255,.82); --sp-ink:#46525e; --sp-edge:rgba(255,255,255,.9); --sp-lt:block; --sp-dk:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ocean:#0c3a5e; --ocean-line:#134871; --chip:#0a1a22;
  --land:#3a4d40; --land-edge:#6a8a72; --land-hover:#4a6150;
  --ink:#e8f2f3; --ink-soft:#9db5ba;
  --panel:#12232a; --panel-edge:#24414b;
  --pin:#ff6a50; --target:#4fd08e; --gold:#f0b83a;
  --btn:#e8f2f3; --btn-ink:#0f2730; color-scheme:dark;
  --glass:rgba(12,28,38,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  --sp-bg:rgba(10,24,32,.78); --sp-ink:#a9bec4; --sp-edge:rgba(255,255,255,.12); --sp-lt:none; --sp-dk:block;
}}
:root[data-theme="dark"]{
  --ocean:#0c3a5e; --ocean-line:#134871; --chip:#0a1a22;
  --land:#3a4d40; --land-edge:#6a8a72; --land-hover:#4a6150;
  --ink:#e8f2f3; --ink-soft:#9db5ba;
  --panel:#12232a; --panel-edge:#24414b;
  --pin:#ff6a50; --target:#4fd08e; --gold:#f0b83a;
  --btn:#e8f2f3; --btn-ink:#0f2730; color-scheme:dark;
  --glass:rgba(12,28,38,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  --sp-bg:rgba(10,24,32,.78); --sp-ink:#a9bec4; --sp-edge:rgba(255,255,255,.12); --sp-lt:none; --sp-dk:block;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ocean);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;position:relative}

/* Top bar */
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.topwrap{position:absolute;z-index:4;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{position:relative;pointer-events:auto;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:26px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.headrow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
.headrow .modes{justify-self:end}
.scorebox{white-space:nowrap}
.controls .theme{width:24px;height:24px}
.controls .theme svg{width:13px;height:13px}
.brand{justify-self:start;min-width:0;font-weight:800;font-size:1.1rem;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.brand .bword{display:block;height:32px;width:auto;max-width:none;filter:drop-shadow(0 2px 3px rgba(10,40,90,.18));user-select:none;-webkit-user-drag:none}
.brand.s1 .bword{height:26px}
.brand.s2 .bword{height:21px}
.brand.tight .bword{display:none}
/* loading splash: the logo, big and centred, pulsing softly until the game is ready, then fading out */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--ocean) 70%,#fff) 0%,var(--ocean) 70%);transition:opacity .45s ease,visibility .45s}
.splash .spin{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.splash .spin > img{width:min(58vw,280px);height:auto;filter:drop-shadow(0 14px 28px rgba(10,30,40,.25));animation:splashpulse 1.6s ease-in-out infinite}
.splash{overflow-y:auto}
.splash .spin{margin:auto}
.splash .spbody{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(320px,86vw);opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.splash.ready .spbody{opacity:1;transform:none}
.splash .sptag{margin:0;max-width:300px;font:600 1.02rem/1.4 var(--display);color:var(--ink)}
.splash .sphi{margin:0;font:800 1.25rem var(--display);color:var(--ink);letter-spacing:-.01em}
.splash .langpills{background:color-mix(in srgb,var(--panel) 45%,transparent)}
.splash form{display:flex;flex-direction:column;gap:12px;width:100%}
.splash .namefield{text-align:start}
.splash .namefield input{background:var(--panel)}
.splash .namefield .hint{font-size:.8rem;color:var(--ink-soft)}
.splash .err{color:var(--pin);font-size:.85rem;min-height:0}
.splash .err:empty{display:none}
.splash .spexplore{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:1rem;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.splash .spexplore svg{width:18px;height:18px}
.study{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px dashed var(--panel-edge);color:var(--ink-soft);font-size:.92rem}
.study button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:.9rem}
.study svg{width:16px;height:16px}
.splash .spgo{width:100%;padding:15px 28px;font-size:1.15rem;box-shadow:0 10px 24px rgba(10,30,40,.25)}
.splash.out{opacity:0;visibility:hidden}
.splash.out img{animation:none;transform:scale(1.06);transition:transform .45s ease}
@keyframes splashpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.splash img{animation:none}}
.welcome .hero{display:block;width:min(168px,48%);height:auto;margin:-4px auto 2px;filter:drop-shadow(0 8px 16px rgba(10,30,40,.18));animation:heroin .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes heroin{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
.welcome h3{text-align:center}
.modes{display:flex;gap:4px;background:color-mix(in srgb,var(--chip) 55%,transparent);padding:3px;border-radius:999px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none}
.modes button{border:0;background:transparent;color:var(--ink-soft);font:600 .85rem var(--display);padding:6px 11px;border-radius:999px;cursor:pointer}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 55%,transparent);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.theme svg{width:18px;height:18px}
.theme:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* top bar: tabs, then a status row that never moves, then the question in a fixed-height row */
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.stats{display:flex;align-items:center;gap:12px;font:500 .8rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.controls{display:flex;align-items:center;gap:6px}
.levels.off,.exploring .stats > *{visibility:hidden}
.prompt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0;border-top:1px solid var(--glass-edge);padding-top:9px}
.qline{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;max-width:100%;height:clamp(44px,11vw,58px)}
.qline .place{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qline .place.long{font-size:clamp(1.15rem,4.4vw,1.6rem)}
.qline .hint:empty{display:none}
.qline .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.prompt .label{font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.prompt .place{font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.prompt .hint{color:var(--ink-soft);font-size:.95rem}
.meta{display:flex;gap:14px;font:500 .8rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.card.stack{flex-direction:column;align-items:stretch;gap:12px}
.cardrow{display:flex;align-items:center;gap:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--ink);font:700 1rem var(--display);padding:13px 10px;border-radius:16px;cursor:pointer;text-align:center;line-height:1.2}
.choice:hover:not(:disabled){background:var(--panel)}
.choice:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.choice:disabled{cursor:default}
.choice.right{background:var(--target);color:var(--btn-ink);border-color:transparent}
.choice.wrong{background:var(--pin);color:#fff;border-color:transparent}
.choice.fade{opacity:.45}
.flagimg{display:block;height:clamp(40px,10.5vw,56px);width:auto;aspect-ratio:4/3;border-radius:5px;box-shadow:0 0 0 1px var(--panel-edge),0 4px 12px rgba(10,30,40,.18);max-width:100%}
/* solid, so white or pale flag areas never read as water */
.country.correct.flagged,.easy .country.flagged{fill-opacity:1;stroke:var(--target);stroke-width:2}
@keyframes flagin{from{opacity:0}to{opacity:1}}
#flagfill image{animation:flagin .5s ease-out}
.miniflag{display:inline-block;height:13px;width:auto;aspect-ratio:4/3;border-radius:2px;box-shadow:0 0 0 1px var(--panel-edge);vertical-align:-1px;margin-inline-end:7px}
.langwrap{position:relative;display:inline-flex}
.langbtn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 55%,transparent);color:var(--ink);font:600 .72rem var(--mono);cursor:pointer}
.langbtn svg{width:14px;height:14px}
.langbtn:focus-visible,.langmenu button:focus-visible,.langpills button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:6;display:flex;flex-direction:column;min-width:130px;padding:6px;border-radius:16px}
.langmenu[hidden]{display:none}
.langmenu button{border:0;background:transparent;color:var(--ink);font:600 .95rem var(--display);text-align:start;padding:9px 12px;border-radius:10px;cursor:pointer}
.langmenu button:hover{background:color-mix(in srgb,var(--chip) 70%,transparent)}
.langmenu button[aria-checked="true"]{background:var(--panel)}
/* compact language switch; always English · Français · العربية in the same places, whatever the page direction */
.langpills{display:inline-flex;align-self:center;gap:2px;background:var(--chip);padding:3px;border-radius:999px}
.langpills button{border:0;background:transparent;color:var(--ink-soft);font:600 .78rem var(--display);padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.langpills button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* Arabic: right to left, and no letter-spacing or capitals (they break joined letters) */
[dir="rtl"]{--mono:"IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif}
[dir="rtl"] *{letter-spacing:0!important}
[dir="rtl"] .prompt .label,[dir="rtl"] .namefield label,[dir="rtl"] .tag{text-transform:none}
[dir="rtl"] .prompt .label{font-size:.85rem}
[dir="rtl"] .list .p,[dir="rtl"] .board li .rk{text-align:left}
[dir="rtl"] .zoomctl{align-self:flex-end}
.modes .m-explore{display:inline-grid;place-items:center;padding:6px 9px}
.modes .m-explore svg{width:16px;height:16px;display:block}
.exploring #levels{visibility:hidden}
.excard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.excard .exflag{grid-row:span 2;height:56px;width:auto;aspect-ratio:4/3;border-radius:6px;box-shadow:0 0 0 1px var(--panel-edge),0 4px 12px rgba(10,30,40,.18)}
.excard .exname{font:800 1.35rem var(--display);letter-spacing:-.02em;line-height:1.1;min-width:0}
.excard .exrows{display:flex;flex-direction:column;gap:2px;min-width:0}
.excard dl{grid-column:1/-1;margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.excard dt{font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);align-self:center}
.excard dd{margin:0;font-weight:700;min-width:0}
.excard dd.cities{font-weight:500;color:var(--ink-soft)}
.excard .btns{grid-column:1/-1;justify-content:flex-end}
.excard .exnote{grid-column:1/-1;font-size:.85rem;color:var(--ink-soft);line-height:1.35;padding-top:2px}
[dir="rtl"] .excard dt{text-transform:none}
/* first-visit tour: a soft spotlight on the real controls, one short tip at a time */
.tour{position:fixed;inset:0;z-index:30}
.tour[hidden]{display:none}
.tour-ring{position:fixed;border-radius:20px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 9999px rgba(8,28,38,.42);pointer-events:none;
  transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip{position:fixed;width:min(300px,calc(100vw - 24px));padding:16px 16px 14px;border-radius:20px;display:flex;flex-direction:column;gap:6px;background:var(--panel);
  border:1px solid var(--panel-edge);box-shadow:0 14px 40px rgba(10,30,40,.28);transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1);animation:tipin .3s ease-out}
.tour-tip h4{margin:0;font:800 1.08rem var(--display);letter-spacing:-.01em}
.tour-tip p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.4}
.tour-tip .tour-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.tour-tip .tour-dots{display:flex;gap:5px;margin-inline-end:auto}
.tour-tip .tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--panel-edge)}
.tour-tip .tour-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.tour-tip .btn{padding:9px 18px;font-size:.95rem}
.tour-tip .tour-skip{border:0;background:none;color:var(--ink-soft);font:600 .88rem var(--display);cursor:pointer;padding:6px}
.tour-tip .tour-skip:focus-visible{outline:3px solid var(--pin);outline-offset:2px;border-radius:8px}
@keyframes tipin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a2hs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px;border-radius:16px;background:var(--chip);text-align:start}
.a2hs .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--ocean);box-shadow:0 2px 6px rgba(10,30,40,.15)}
.a2hs .ic{overflow:hidden}.a2hs .ic img{display:block;padding:2px;box-sizing:border-box}
.a2hs .ic svg{width:24px;height:24px}
.a2hs b.tt{font:800 .98rem var(--display)}
.a2hs .st{color:var(--ink-soft);font-size:.9rem;line-height:1.4}
.a2hs .st svg{width:15px;height:15px;vertical-align:-2px;margin:0 2px}
.a2hs .st small{display:block;margin-top:4px;font-size:.8rem}
.a2hs .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.a2hs .acts .btn,.a2hs .acts .btn2{padding:8px 16px;font-size:.9rem}
.hrules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.hrules li{position:relative;padding-inline-start:16px;font:500 .9rem/1.4 var(--display);color:var(--ink-soft)}
.hrules li::before{content:"";position:absolute;inset-inline-start:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--target)}
.hrules b,.hgames dd b{color:var(--ink);font-weight:700}
.hh{margin:4px 0 -4px;font:800 .78rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.hgames{display:grid;grid-template-columns:max-content 1fr;gap:0;margin:0}
.hgames dt,.hgames dd{margin:0;padding:8px 0;border-top:1px solid var(--panel-edge);font:500 .88rem/1.35 var(--display)}
.hgames dt{font-weight:800;color:var(--ink)}
.hgames dd{color:var(--ink-soft);padding-inline-start:14px}
.hgames dt:first-of-type,.hgames dt:first-of-type + dd{border-top:0}
.helpa2hs{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--panel-edge);padding-top:10px}
#help .sheet{gap:12px}
@media (max-width:360px){.hgames{grid-template-columns:1fr}.hgames dt{padding-bottom:2px}.hgames dd{border-top:0;padding-top:0;padding-inline-start:0}}
#help #help-ok{position:sticky;bottom:0}
.helpa2hs summary{cursor:pointer;font:700 .88rem var(--display);color:var(--ink);list-style-position:inside}
.helpa2hs p{margin:6px 0 0;font-size:.86rem}
.helpa2hs p svg{width:15px;height:15px;vertical-align:-2px;margin:0 2px}
.lives{display:flex;gap:3px;align-items:center}
.lives svg{width:17px;height:17px;transition:transform .25s ease}
.lives .on{fill:var(--pin)}
.lives .off{fill:var(--panel-edge);transform:scale(.85)}
.lives .lost{animation:lose .5s ease}
.lives .gain{animation:gain .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes gain{0%{transform:scale(.3)}50%{transform:scale(1.7)}100%{transform:scale(1)}}
/* streak pop-up: drops in under the top bar, then fades away */
.toast{position:absolute;z-index:6;left:50%;top:calc(var(--toastTop,150px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;font:700 1rem var(--display);color:var(--ink);white-space:nowrap;
  transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .th{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--pin) 16%,transparent)}
.toast .th svg{width:20px;height:20px;fill:var(--pin);animation:gain .9s cubic-bezier(.2,1.6,.4,1)}
.toast small{display:block;font:500 .78rem var(--display);color:var(--ink-soft)}
/* end-of-game medal */
.medal{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;margin:-4px 0 2px}
.medal .m{font-size:76px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  filter:drop-shadow(0 8px 14px rgba(150,100,0,.35));animation:medaldrop 1s cubic-bezier(.2,1.5,.4,1) both, medalswing 2.6s ease-in-out 1s infinite alternate;transform-origin:50% 0}
.medal .ml{font:800 1rem var(--display);color:var(--gold);letter-spacing:.01em;animation:fadeup .5s ease .6s both}
@keyframes medaldrop{0%{transform:translateY(-120px) rotate(-25deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes medalswing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){.medal .m,.medal .ml{animation:none}}
@keyframes lose{0%{transform:scale(1.35)}100%{transform:scale(.85)}}

/* Map */
.mapwrap{position:absolute;inset:0}
svg#map{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
/* while the map is zooming or panning: no live blur behind the glass (it is the costly part on big screens) */
.zooming .glass,.zooming .top,.zooming .card,.zooming .zoom button,.zooming .sponsor{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.zooming .glass,.zooming .top,.zooming .card{background:color-mix(in srgb,var(--panel) 88%,transparent)!important}
.zooming .country,.zooming .graticule{shape-rendering:optimizeSpeed}
.graticule{fill:none;stroke:var(--ocean-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.country{fill:var(--land);stroke:var(--land-edge);stroke-width:.5;vector-effect:non-scaling-stroke}
.countries-mode .country{cursor:pointer}
.countries-mode .country:hover{fill:var(--land-hover)}
.country.picked{fill:var(--pin);fill-opacity:.55}
.easy .country{fill-opacity:.4}
.easy .country.focus{fill-opacity:1;stroke:var(--ink-soft);stroke-width:1.2}
.safezone{fill:var(--target);fill-opacity:.12;stroke:var(--target);stroke-width:1.2;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.labelrow{display:flex;align-items:center;gap:8px}
.levels{display:flex;gap:2px;background:color-mix(in srgb,var(--chip) 55%,transparent);padding:2px;border-radius:999px}
.levels button{border:0;background:transparent;color:var(--ink-soft);font:600 .72rem var(--display);padding:3px 10px;border-radius:999px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.levels button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
/* region chip (Whole world / Africa / ...) and its picker */
.country.outside{opacity:.28;pointer-events:none}
.pracbar{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:5px 5px 5px 12px;border-radius:999px;background:color-mix(in srgb,var(--target) 18%,transparent);font:700 .8rem var(--display);color:var(--ink);min-width:0}
.pracbar[hidden]{display:none}
.pracbar .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pracbar button{flex:none;border:0;border-radius:999px;padding:5px 12px;font:700 .75rem var(--display);background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);cursor:pointer;touch-action:manipulation}
[dir="rtl"] .pracbar{padding:5px 12px 5px 5px}
.card .pracgo{display:flex;flex-direction:row;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border:0;border-radius:18px;background:color-mix(in srgb,var(--panel) 60%,transparent);text-align:start;color:var(--ink);cursor:pointer;touch-action:manipulation;font:inherit}
.card .pracgo .pi{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:linear-gradient(135deg,#d7f5e6,#9fe0bf)}
.card .pracgo .pw{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .pracgo b{font:800 .95rem var(--display)}
.card .pracgo small{font:500 .78rem var(--display);color:var(--ink-soft)}
.card .pracgo .chev{flex:none;color:var(--ink-soft);font-size:1.3rem}
[dir="rtl"] .card .pracgo .chev{transform:scaleX(-1)}
.card .pracgo:active{transform:scale(.98)}
.pf.rg .seg{display:flex;align-self:center;gap:2px;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.pf.rg .seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font:700 .78rem var(--display);color:var(--ink-soft);cursor:pointer;touch-action:manipulation}
.pf.rg .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pf.rg h3{display:block;margin:4px 0 0;text-align:center;font:800 1.1rem var(--display);color:var(--ink)}
.pf.rg .sub{margin:-8px 0 0;text-align:center;font:600 .8rem var(--display);color:var(--ink-soft)}
.pf.rg .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rg .tl{position:relative;border:0;border-radius:18px;padding:10px 12px;text-align:start;color:var(--ink);font:800 .95rem var(--display);display:flex;flex-direction:column;gap:2px;cursor:pointer;touch-action:manipulation;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.rg .tl svg{width:100%;height:54px;margin-bottom:4px;display:block}
.rg .tl svg path{fill:var(--target);opacity:.75}
.rg .tl small{font:600 .72rem var(--display);color:var(--ink-soft)}
.rg .tl[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--target);background:color-mix(in srgb,var(--target) 14%,var(--panel))}
.rg .tl:active:not(:disabled){transform:scale(.97)}
.rg .tl:disabled{cursor:default;opacity:.5}
.pf.rg .note{text-align:center;font:600 .74rem/1.35 var(--display);color:var(--ink-soft)}
.pf.rg .tick{align-self:center;font:700 .74rem var(--display);color:#c2410c;background:color-mix(in srgb,#f97316 16%,transparent);padding:4px 10px;border-radius:999px}
.smenu .rowq.one{grid-template-columns:1fr}
.country.correct{fill:var(--target);fill-opacity:.75}
.guessline{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none;vector-effect:non-scaling-stroke}
.zoomctl{align-self:flex-end;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.zoomctl button{width:40px;height:40px;border-radius:50%;color:var(--ink);font:600 1.2rem var(--mono);cursor:pointer}

/* Bottom tray */
.tray{position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
/* the result of a multiple-choice round sits in its own card above the untouched answers */
.resultbar{flex-direction:row;align-items:center;gap:14px;padding:12px 14px 12px 18px;animation:resultin .32s cubic-bezier(.2,1.2,.4,1) both}
.resultbar[hidden]{display:none}
@keyframes resultin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card{pointer-events:auto;width:100%;max-width:520px;border-radius:26px;
  padding:14px 16px 14px 20px;display:flex;align-items:center;gap:14px}
.card .txt{flex:1;min-width:0}
.card .big{font:600 1.5rem var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .small{color:var(--ink-soft);font-size:.9rem}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:700 1rem var(--display);padding:12px 22px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.modes button:focus-visible,.zoomctl button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.bar{height:6px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .6s ease}

/* Results */
.results{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--ocean) 70%,transparent);backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(10,30,40,.25)}
.sheet h2{margin:0;font-size:1rem;font-weight:600;color:var(--ink-soft)}
.total{font:600 3rem var(--mono);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:1rem;color:var(--ink-soft);letter-spacing:0}
.verdict{font-weight:700;font-size:1.15rem}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none;max-height:min(38vh,320px);overflow:auto}
.list li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:7px 0;border-bottom:1px solid var(--panel-edge);font-size:.95rem}
.list li:last-child{border-bottom:0}
.list .d{font:500 .85rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.list .p{font:600 .9rem var(--mono);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.best{font:500 .8rem var(--mono);color:var(--ink-soft)}
/* welcome + leaderboard */
.welcome h3{margin:0;font-size:1.6rem;letter-spacing:-.03em;line-height:1.1}
.welcome p{margin:0;color:var(--ink-soft);line-height:1.45}
.namefield{display:flex;flex-direction:column;gap:6px}
.namefield label{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.namefield input{font:700 1.1rem var(--display);color:var(--ink);background:var(--chip);border:1px solid var(--panel-edge);border-radius:14px;padding:12px 14px;width:100%}
.namefield input:focus{outline:3px solid color-mix(in srgb,var(--pin) 55%,transparent);outline-offset:1px}
.namefield .err{color:var(--pin);font-size:.85rem;min-height:1.1em}
/* username + PIN side by side */
.idrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:end}
.idrow .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.idrow input.pin{text-align:center;letter-spacing:.3em;font-variant-numeric:tabular-nums;padding-inline:8px}
.btn[aria-busy="true"]{opacity:.65;pointer-events:none}
/* 🏆 leaderboard: button in the top bar, link on the start screen, and a sheet with every board */
.lbbtn span{font-size:.8rem;line-height:1}
/* 🌍 world tour: the whole list of a game played through without running out of lives */
.wtwrap{z-index:72;background:radial-gradient(circle at 50% 40%,rgba(255,215,106,.35),rgba(10,30,45,.55))}
.wt{position:relative;overflow:hidden;width:min(340px,92vw);border-radius:28px;padding:26px 22px 20px;text-align:center;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.35);animation:smpop .35s cubic-bezier(.2,1.3,.4,1)}
.wt::before{content:"";position:absolute;inset:-40% -20% auto;height:220px;background:conic-gradient(from 0deg,#ffd76a33,#6cc3ff33,#2bb67333,#ffd76a33);filter:blur(30px);pointer-events:none}
.wt .globe img{width:104px;height:auto;display:block}
.pf .bd .ic.img{background:none!important;box-shadow:none!important;width:60px;height:60px}
.pf .bd .bar.none{visibility:hidden}
.pf .bd .bimg{width:60px;height:60px;object-fit:contain;display:block}
.pf .bd.gold .ic.img .bimg,.pf .bd.silver .ic.img .bimg{filter:drop-shadow(0 6px 10px rgba(240,169,43,.35))}
.wtimg{width:1.15em;height:1.15em;vertical-align:-.2em;object-fit:contain}
.wt .globe{position:relative;font-size:84px;line-height:1;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));animation:wtspin 1.2s ease-out}
@keyframes wtspin{from{transform:scale(.4) rotate(-40deg);opacity:0}}
.wt .lap{position:absolute;top:18px;inset-inline-end:18px;font:800 .78rem var(--display);background:linear-gradient(135deg,#ffd76a,#f0a92b);color:#3b2600;border-radius:999px;padding:5px 10px}
.wt h2{position:relative;margin:14px 0 6px;font:800 1.45rem/1.15 var(--display);color:var(--ink);letter-spacing:-.01em}
.wt p{position:relative;margin:0 0 14px;color:var(--ink-soft);font:500 .95rem/1.4 var(--display)}
.wt .flags{position:relative;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:0 auto 16px;max-width:290px}
.wt .flags img{width:30px;height:22px;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.2);object-fit:cover}
.wt .stats{position:relative;display:flex;justify-content:center;gap:8px;margin-bottom:16px}
.wt .stats div{background:var(--chip);border-radius:14px;padding:8px 10px;font:600 .72rem var(--display);color:var(--ink-soft);min-width:70px}
.wt .stats b{display:block;font:800 1.12rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.wt .btn{position:relative;width:100%;padding:14px;font-size:1.05rem}
.wt canvas.confetti{position:absolute;inset:0;pointer-events:none}
.wtbadge{align-self:center;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;background:linear-gradient(135deg,#ffefc2,#ffd76a);color:#5a3b00;font:800 .88rem var(--display);box-shadow:0 4px 14px rgba(240,169,43,.35)}
.wtbadge span{font-size:1.3rem;line-height:1}
.board .wtag{font-size:.9em;margin-inline-start:6px;vertical-align:-.05em;cursor:default}
.board .bdg{display:inline-flex;gap:1px;margin-inline-start:6px;font-size:.85em;vertical-align:-.05em;letter-spacing:0}
/* profile: a bottom sheet with your best numbers and achievements */
.pfscrim{position:fixed;inset:0;z-index:68;background:rgba(10,25,35,.22);-webkit-backdrop-filter:blur(10px) saturate(120%);backdrop-filter:blur(10px) saturate(120%);display:flex;align-items:flex-end;justify-content:center;animation:fadein .2s ease;
  /* same side and bottom spacing as the answer cards */
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
/* a floating glass card, the same width, corners and frosted look as the game's cards */
.pf{width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:26px;padding:10px 16px 16px;display:flex;flex-direction:column;gap:14px;text-align:start;animation:pfup .32s cubic-bezier(.2,1,.3,1);
  background:color-mix(in srgb,var(--panel) 72%,transparent);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow),0 24px 60px rgba(10,30,45,.22);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.pf .st div,.pf .bd .ic,.pf .gnote,.pick .opt{background:color-mix(in srgb,var(--panel) 55%,transparent)}
.pf .btn2{background:color-mix(in srgb,var(--panel) 60%,transparent)}
@keyframes pfup{from{transform:translateY(40%);opacity:.4}}
.pf .grab{width:40px;height:5px;border-radius:9px;background:var(--chip);align-self:center;border:0;padding:0;cursor:pointer}
.pf .hd{display:flex;align-items:center;gap:14px}
.pf.pe{gap:16px}
.pf .peh{margin:2px 0 0;text-align:center;display:block;font:800 1.1rem var(--display);color:var(--ink)}
.pf .peav{align-self:center;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;color:var(--ink-soft);font:700 .8rem var(--display)}
.pf .peav .av{width:84px;height:84px;font-size:2rem}
.pf .peav .av.hasav{width:84px;height:84px}
.pf .peav .avedit{position:absolute;inset-inline-end:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--panel);font-size:.85rem;border:2px solid var(--panel)}
.pf .perow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.pf .pen{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pf .pen small{font:700 .7rem var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.pf .pen b{font:800 1.1rem var(--display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .pes{display:flex;align-items:center;gap:5px;font:600 .74rem var(--display);color:var(--ink-soft)}
.pf .pes i{width:7px;height:7px;border-radius:50%;background:var(--target)}
.pf .pes.off i{background:#9aa9b2}
.pf .perow .btn,.pf .perow .btn2{flex:none;padding:9px 16px;font-size:.88rem}
.pf .av{position:relative;width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 1.6rem var(--display);color:#fff;background:linear-gradient(135deg,#2bb673,#1f8a5b);box-shadow:0 6px 16px rgba(31,138,91,.35);text-transform:uppercase}
.pf .av.guest{background:linear-gradient(135deg,#a8b6bf,#7f909b);box-shadow:none}
.pf .av svg{width:32px;height:32px}
.pf .av i{position:absolute;inset-inline-end:-6px;bottom:-4px;font-style:normal;font-size:1.3rem}
.pf .nm{min-width:0}
.pf .nm b{display:block;font:800 1.35rem var(--display);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .nm small{font:600 .82rem var(--display);color:var(--ink-soft)}
.pf .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf .st div{background:var(--chip);border-radius:16px;padding:10px 6px;text-align:center;font:600 .7rem/1.2 var(--display);color:var(--ink-soft)}
.pf .st b{display:block;font:800 1.2rem var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.pf h3{margin:2px 0 -4px;font:800 1rem var(--display);color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
.pf h3 span{font-weight:600;color:var(--ink-soft);font-size:.85rem}
.pf>*{flex-shrink:0}
.pf .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 6px}
.pf .bd{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.pf .bd .ic{position:relative;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:1.65rem;background:var(--chip)}
.pf .bd .bar{width:56px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden;margin-top:-1px}
.pf .bd .bar i{display:block;height:100%;border-radius:4px;background:var(--target)}
.pf .bd.gold .ic{background:linear-gradient(135deg,#ffe9a8,#f5b638);box-shadow:0 6px 14px rgba(240,169,43,.4)}
.pf .bd.silver .ic{background:linear-gradient(135deg,#f1f4f6,#b9c4cc);box-shadow:0 6px 14px rgba(120,140,155,.35)}
.pf .bd.locked .ic > span{filter:grayscale(1);opacity:.45}
.pf .bd .x{position:absolute;inset-inline-end:-4px;top:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--ink);color:var(--panel);font:800 .68rem/20px var(--display);padding:0 5px}
.pf .bd b{font:700 .72rem/1.15 var(--display);color:var(--ink);max-width:100%;overflow-wrap:anywhere;hyphens:auto}
@media (max-width:359px){.pf .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pf .bd small{font:600 .6rem/1.2 var(--display);color:var(--ink-soft)}
.pf .bd.locked b{color:var(--ink-soft)}
.pf .gnote{margin:0;padding:10px 12px;border-radius:14px;background:var(--chip);font:600 .82rem/1.35 var(--display);color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pf .gnote button{flex:none}
.pf .pfclose{width:100%}
.smenu .prof{cursor:pointer}
/* avatars: a picture (traveller portrait or animal) on a coloured circle */
.avpic{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle;line-height:1}
.avpic svg,.pf .av .avpic svg,.smenu .avbig .avpic svg{width:100%;height:100%;display:block}
.avpic.emo{font-size:calc(var(--s) * .58)}
.board .avpic{margin-inline-end:7px}
.smenu .avbig.hasav,.pf .av.hasav{background:none!important;box-shadow:none;padding:0}
.pf .av .avedit{position:absolute;inset-inline-end:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:700 .72rem var(--display);border:2px solid var(--panel)}
.pf .av{cursor:pointer;border:0;padding:0}
.pick{display:flex;flex-direction:column;gap:12px}
.pick h4{margin:4px 0 -2px;font:700 .76rem var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
[dir="rtl"] .pick h4{letter-spacing:0}
.pick .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
.pick .g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pick .g6 .avpic{width:100%!important;max-width:46px;height:auto!important;aspect-ratio:1}
.pick .tv{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font:700 .64rem/1.15 var(--display);color:var(--ink);border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.pick .tv .avpic{border:2.5px solid transparent;transition:transform .15s}
.pick .tv[aria-pressed="true"] .avpic{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--panel)}
.pick .tv:active .avpic{transform:scale(.93)}
.pick .cols{display:flex;gap:10px;justify-content:space-between}
.pick .cols button{flex:1;aspect-ratio:1;max-width:36px;border-radius:50%;border:3px solid var(--panel);padding:0;cursor:pointer;touch-action:manipulation}
.pick .cols button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.pick .acts{display:flex;gap:8px}.pick .acts .btn,.pick .acts .btn2{flex:1}

/* "Achievement unlocked" pop-up: slides in under the top bar, never pauses the game */
.achtoast{position:fixed;left:50%;top:var(--achTop,140px);z-index:74;display:flex;align-items:center;gap:12px;padding:10px 16px 10px 10px;border-radius:20px;background:var(--panel);box-shadow:0 16px 40px rgba(10,30,45,.3);border:1px solid var(--glass-edge);width:max-content;max-width:calc(100vw - 32px);text-align:start;pointer-events:none;opacity:0;transform:translate(-50%,-14px) scale(.96);transition:opacity .3s ease,transform .35s cubic-bezier(.2,1.3,.4,1)}
.achtoast.show{opacity:1;transform:translate(-50%,0)}

/* How to play and the leaderboard: the same frosted bottom sheet as Edit profile and Achievements */

/* "Powered by" sponsor: a small pill under the answers and at the foot of the start screen */
.sponsor.nolink{cursor:default}
.sponsor{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;padding:5px 8px 5px 12px;border-radius:999px;text-decoration:none;
  background:var(--sp-bg);border:1px solid var(--sp-edge);box-shadow:0 2px 10px rgba(10,30,40,.14);color:var(--sp-ink);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 .72rem/1 var(--display);letter-spacing:.01em;white-space:nowrap;transition:transform .15s ease}
.sponsor:active{transform:scale(.96)}
.sponsor img{height:22px;width:auto;max-width:130px;display:var(--sp-lt)}
.sponsor img.dk{display:var(--sp-dk)}
/* in the game the pill sits halfway between the answers and the bottom edge of the screen (home-bar area included) */
.tray.sp{padding-bottom:0}
.tray.sp .sponsor{margin-top:calc(env(safe-area-inset-bottom,0px) + 4px);margin-bottom:14px}
.splash{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.splash > .sponsor{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}
.splash > .sponsor:active{transform:translateX(-50%) scale(.96)}
/* "Offline" tab hanging from the top bar; hidden whenever there is a connection */
.offbadge{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:999px;
  background:var(--ink);color:var(--panel);font:700 .74rem/1 var(--display);letter-spacing:.02em;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.18);animation:offin .3s ease}
.offbadge svg{width:14px;height:14px}
@keyframes offin{from{opacity:0;transform:translate(-50%,-4px)}}
/* 15-second timer: a burning fuse along the top of the question. Hottest (yellow) at the flame, embers (red) behind;
   the flame flickers, and burns bigger and faster in the last 3 seconds. */
.timer{position:absolute;top:-2px;left:0;right:0;height:4px;pointer-events:none}
.timer i{position:relative;display:block;height:100%;width:calc(var(--f,0) * 100%);border-radius:4px;opacity:0;
  background:linear-gradient(90deg,#b3200f,#ff4d12 35%,#ff9a1f 75%,#ffd34d);
  box-shadow:0 0 6px rgba(255,110,20,.7),0 0 14px rgba(255,70,0,.3);
  transition:width .12s linear,opacity .3s ease;animation:glow 1.2s ease-in-out infinite}
[dir="rtl"] .timer i{background:linear-gradient(270deg,#b3200f,#ff4d12 35%,#ff9a1f 75%,#ffd34d)}
.timer i::after{content:"🔥";position:absolute;inset-inline-end:-9px;top:50%;font-size:15px;line-height:1;
  transform:translateY(-64%);transform-origin:50% 90%;filter:drop-shadow(0 0 4px rgba(255,140,0,.85));
  animation:flicker .32s ease-in-out infinite alternate}
.timer.on i{opacity:1}
.timer.low i{animation-duration:.5s}
.timer.low i::after{font-size:19px;animation-duration:.16s}
@keyframes glow{50%{box-shadow:0 0 9px rgba(255,140,30,.95),0 0 20px rgba(255,70,0,.45)}}
@keyframes flicker{from{transform:translateY(-64%) scale(.92) rotate(-6deg)}to{transform:translateY(-68%) scale(1.08) rotate(5deg)}}
@media (prefers-reduced-motion: reduce){.timer i,.timer i::after{animation:none}.timer i{transition:opacity .3s ease}}

.scale{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.scale .meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.scale .meter span{display:block;height:100%;background:var(--gold)}
.scale .pts{text-align:right;font-weight:600;min-width:4ch}

@media (max-width:480px){
  .card .big{font-size:1.25rem}
  .meta{gap:10px}
  .modes button{padding:6px 7px;font-size:.78rem}
  .modes .m-explore{padding:6px 7px}
  .headrow{gap:6px}
}
/* most phones (up to ~430px wide): tighten the tab row so all five tabs fit beside the logo */
@media (max-width:380px){
  /* narrow phones: "✓ 4" instead of "Score 4", and a tighter level switch, so the status row always fits */
  .scorebox [data-i18n="score"]{display:none}
  .scorebox b::before{content:"✓ ";color:var(--target);font-weight:700}
  .levels button{padding:3px 7px}
  .controls{gap:4px}
}
@media (max-width:430px){
  .stats{gap:8px}
  .controls{gap:5px}
  .lives svg{width:15px;height:15px}
  .top{padding-left:10px;padding-right:10px}
  .topwrap{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .modes{gap:1px;padding:2px}
  .modes button{padding:6px 6px;font-size:.75rem;letter-spacing:-.01em}
  .modes .m-explore{padding:6px 5px}
  .headrow{gap:4px}
}
/* ---------- tactile feedback: every button squeezes a little when pressed and springs back ---------- */
button,.card,.tray{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.3,.7,.4,1.5),background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease}
button:active:not(:disabled){transform:scale(.92);transition-duration:.06s}
.btn:active:not(:disabled),.btn2:active:not(:disabled),.choice:active:not(:disabled){transform:scale(.96)}
.modes button:active:not(:disabled),.levels button:active:not(:disabled),.langpills button:active:not(:disabled){transform:scale(.9)}
/* answers react: the right one pops, a wrong pick shakes, the verdict slides in */
.choice.right{animation:answerpop .5s cubic-bezier(.2,1.6,.4,1)}
.choice.wrong{animation:answershake .42s ease}
.verdictline{animation:fadeup .3s ease both}
.lock-pop{animation:answerpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes answerpop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes answershake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

   leaving gaps around the flag. So the copy used to fill a country says "stretch" inside the flag file itself. */
const stretchedFlags = {};
function stretchFlag(name){
  if (stretchedFlags[name]) return stretchedFlags[name];
  const uri = FLAGS[name] || "";
  try {
    const bin = atob(uri.slice(uri.indexOf(",") + 1));
    const svgText = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))
      .replace(/<svg\b(?![^>]*preserveAspectRatio)/, '<svg preserveAspectRatio="none"');
    return stretchedFlags[name] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  } catch(e){ return uri; }
}

/* Bounds on the flat map. A few countries cross the 180° line (Russia's Chukotka, Fiji, the Aleutians), and the
   piece past it is drawn at the opposite edge, which would make the shape look as wide as the world.
   When that happens, measure only the points on the same side of the 180° line as the shape's centre. */
function safeBounds(obj){
  const b = path.bounds(obj), sphere = path.bounds({type:"Sphere"});
  if (b[1][0] - b[0][0] < 0.5 * (sphere[1][0] - sphere[0][0])) return b;
  const pts = [];
  const walk = c => typeof c[0] === "number" ? pts.push(c) : c.forEach(walk);
  const geoms = obj.type === "FeatureCollection" ? obj.features.map(f => f.geometry || f) : [obj.geometry || obj];
  geoms.forEach(g => g && g.coordinates && walk(g.coordinates));
  const east = d3.geoCentroid(obj)[0] >= 0;
  const xy = pts.filter(p => east ? p[0] > -90 : p[0] < 90).map(p => projection(p)).filter(Boolean);
  if (!xy.length) return b;
  return [[d3.min(xy, q => q[0]), d3.min(xy, q => q[1])], [d3.max(xy, q => q[0]), d3.max(xy, q => q[1])]];
}
function setFlagPattern(f){
  const g = f.geometry;
  const main = g.type === "MultiPolygon"
    ? g.coordinates.map(c => ({type:"Polygon", coordinates:c})).reduce((a, b) => d3.geoArea(a) > d3.geoArea(b) ? a : b)
    : g;
  const [[x0, y0], [x1, y1]] = safeBounds(main);
  const w = Math.max(x1 - x0, 1), h = Math.max(y1 - y0, 1);
  flagPattern.attr("x", x0).attr("y", y0).attr("width", w).attr("height", h);
  const src = stretchFlag(f.properties.name);
  if (flagPatternImg.attr("href") !== src) flagPatternImg.attr("href", src);
  // Cover the whole shape. The flag may stretch up to 2x to match the shape, so every stripe stays visible
  // (Russia is very wide, Chile very tall); only beyond that is it cropped, centred.
  const flagAR = 4 / 3, minAR = flagAR / 2, maxAR = flagAR * 2, ar = w / h;
  let iw = w, ih = h;
  if (ar > maxAR) ih = w / maxAR;
  else if (ar < minAR) iw = h * minAR;
  flagPatternImg.attr("x", (w - iw) / 2).attr("y", (h - ih) / 2).attr("width", iw).attr("height", ih);
}

  const showFlag = (mode === "flags" || mode === "countries" || mode === "explore") && revealed && current && !!FLAGS[current.properties?.name];

}

function focusBounds(b, maxK = 6, fill = 0.7, ms = 600){
  const r = $("mapwrap").getBoundingClientRect();
  const [[x0,y0],[x1,y1]] = b;
  const w = Math.max(x1-x0, 4), h = Math.max(y1-y0, 4);
  const topH = $("top").getBoundingClientRect().bottom - r.top;
  const availH = r.height - topH - Math.max(isPhone()?120:110, trayH());
  const s = Math.max(1, Math.min(maxK, fill / Math.max(w / r.width, h / availH)));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const tr = d3.zoomIdentity.translate(r.width/2 - s*cx, topH + availH/2 - s*cy).scale(s);
  if (ms) svg.transition().duration(ms).call(zoom.transform, tr); else svg.interrupt().call(zoom.transform, tr);
}
function focusPair(a, b){

  catch(e){ if (seq === boardSeq) el.innerHTML = `<div class="note">${t("lbDown2")}</div>`; return; }
  if (seq !== boardSeq) return;
  const rows = docs.map(d => ({ id: d.id, ...d.data() })).filter(r => +r[field] > 0)
    .sort((a, b) => (+b[field] - +a[field]) || ((+a["t_" + boardKey()] || 0) - (+b["t_" + boardKey()] || 0)));
  boardCache = { rows, field, newBest: newBest || boardCache?.newBest && boardCache.field === field };
  drawBoard();
}
/* every row is numbered; the podium also gets 🥇🥈🥉 in its own column before the name */
const medalCell = r => `<span class="medalrk" aria-hidden="true">${r <= 3 ? ["🥇", "🥈", "🥉"][r - 1] : ""}</span>`;
const lbTitle = () => `<span class="bht"><span aria-hidden="true">🏆</span>${t("leaderboard")}</span>`;
function drawBoard(){
  const el = $("board"); if (!el || !boardCache) return;
  if (boardCache.convex){
    const { top, me, count } = boardCache.convex;
    const line = (name, isMe, rank, score, b = {}) => `<li class="${isMe ? "me" : ""}"><span class="rk">${rank}</span><span class="nm">${medalCell(rank)}${avatarHTML(isMe && myAvatar ? myAvatar : b.avatar, 24, name)}<bdi>${esc(name || t("player"))}</bdi>${badgeTags(b)}${isMe ? t("youTag") : ""}</span><span class="sc">${+score}</span></li>`;
    let list = top.map((r, i) => line(r.name, r.me, i + 1, r.best, r)).join("");
    if (me && me.rank > top.length) list += (me.rank > top.length + 1 ? `<li class="gap">⋯</li>` : "") + line(me.name, true, me.rank, me.best, me);
    const where = !playerName ? t("joinUser") : me ? t("rank", boardCache.newBest, me.rank, count) : t("joinOne");
    document.querySelector(".sheet .best")?.setAttribute("hidden", "");
    el.innerHTML = `<div class="bh">${lbTitle()}</div>
      <div class="note">${where}</div>
      ${top.length ? `<ol>${list}</ol>` : `<div class="note">${t("noScores")}</div>`}`;
    return;
  }
  const { rows, field, newBest } = boardCache;
  const meIdx = rows.findIndex(r => r.id === lb.uid);
  const line = (r, i) => `<li class="${r.id === lb.uid ? "me" : ""}"><span class="rk">${i + 1}</span><span class="nm">${medalCell(i + 1)}${avatarHTML(r.id === lb.uid && myAvatar ? myAvatar : r.av, 24, r.name)}<bdi>${esc(r.name || t("player"))}</bdi>${badgeTags({ tours: Math.max(+r["w_" + boardKey()] || 0, Math.floor(+r[field] / listSize(boardKey()))), champ: i === 0 })}${r.id === lb.uid ? t("youTag") : ""}</span><span class="sc">${+r[field]}</span></li>`;
  const TOP = 5;
  let list = rows.slice(0, TOP).map(line).join("");
  if (meIdx >= TOP) list += (meIdx > TOP ? `<li class="gap">⋯</li>` : "") + line(rows[meIdx], meIdx);
  const where = !playerName ? t("joinName") : meIdx >= 0 ? t("rank", newBest, meIdx + 1, rows.length) : t("joinOne");
  document.querySelector(".sheet .best")?.setAttribute("hidden", "");
  el.innerHTML = `<div class="bh">${lbTitle()}</div>
    <div class="note">${where}</div>
    ${rows.length ? `<ol>${list}</ol>` : `<div class="note">${t("noScores")}</div>`}`;
}

/* ---------- leaderboard sheet: any game and level, from the top bar or the start screen ---------- */
const LB_MODES = ["flags", "countries", "capitals", "cities"];
let lbView = { mode: "flags", level: "easy" }, lbSeq = 0;
const lbKeyOf = v => v.mode === "countries" ? "countries" : v.mode + "_" + v.level;
async function standings(board){
  // { top:[{name,best,me}], me:{rank,best,name}|null, count } from whichever leaderboard this copy uses
  if (lb.kind === "convex") return cx("query", "scores:board", { board, pid: lb.uid, limit: 100 });
  const field = "b_" + board, tf = "t_" + board;
  const docs = (await lb.db.collection("scores").orderBy(field, "desc").limit(500).get()).docs;
  const rows = docs.map(d => ({ id: d.id, ...d.data() })).filter(r => +r[field] > 0)
    .sort((a, b) => (+b[field] - +a[field]) || ((+a[tf] || 0) - (+b[tf] || 0)));
  const i = rows.findIndex(r => r.id === lb.uid);
  const tr = r => Math.max(+r["w_" + board] || 0, Math.floor(+r[field] / listSize(board)));
  return { top: rows.slice(0, 100).map((r, k) => ({ name: r.name, best: +r[field], tours: tr(r), champ: k === 0, avatar: r.av || "", me: r.id === lb.uid })),
           me: i < 0 ? null : { rank: i + 1, best: +rows[i][field], name: rows[i].name, tours: tr(rows[i]), champ: i === 0, avatar: rows[i].av || "" }, count: rows.length };
}
function openBoardSheet(){
  lbView = { mode: mode === "explore" ? "flags" : mode, level: levelOf[mode === "explore" ? "flags" : mode] || "easy" };
  $("lbsheet").hidden = false; $("lbsheet").classList.add("opening"); setTimeout(() => $("lbsheet").classList.remove("opening"), 400); renderBoardSheet();
  setTimeout(() => $("lbsheet").querySelector("[aria-pressed=true]")?.focus({preventScroll:true}), 50);
}
function closeBoardSheet(){ $("lbsheet").hidden = true; lbSeq++; }
function renderBoardSheet(){
  const v = lbView;
  $("lbsheet").innerHTML = `<div class="sheet lbsheet" role="dialog" aria-labelledby="lb-t">
    <button class="grab" id="lbgrab" aria-label="${esc(t("lbClose"))}"></button>
    <h3 id="lb-t"><span aria-hidden="true">🏆</span>${t("leaderboard")}</h3>
    <div class="lbtabs" role="group">${LB_MODES.map(m => `<button data-m="${m}" aria-pressed="${v.mode === m}">${t("m_" + m)}</button>`).join("")}</div>
    <div class="lbtabs lv${v.mode === "countries" ? " off" : ""}" role="group" aria-label="${esc(t("level"))}">${["easy", "pro"].map(l => `<button data-l="${l}" aria-pressed="${v.level === l}">${t(l)}</button>`).join("")}</div>
    <div class="board" id="lbboard"></div>
    <button class="btn2 pfclose" id="lbclose">${t("lbClose")}</button>
  </div>`;
  onTap($("lbgrab"), closeBoardSheet);
  $("lbsheet").querySelectorAll("[data-m]").forEach(b => onTap(b, () => { lbView.mode = b.dataset.m; renderBoardSheet(); }));
  $("lbsheet").querySelectorAll("[data-l]").forEach(b => onTap(b, () => { lbView.level = b.dataset.l; renderBoardSheet(); }));
  onTap($("lbclose"), closeBoardSheet);
  fillBoardSheet();
}
async function fillBoardSheet(){
  const el = $("lbboard"), seq = ++lbSeq, board = lbKeyOf(lbView);
  const note = k => { if (seq === lbSeq) el.innerHTML = `<div class="note">${t(k)}</div>`; };
  if (lb.off){ note("lbSignin"); return; }
  note("loading");
  const t0 = Date.now();
  while (!lb.ready && !lb.off && Date.now() - t0 < 10000) await new Promise(r => setTimeout(r, 200));
  if (seq !== lbSeq) return;
  if (!lb.ready){ note(lb.off ? "lbSignin" : "lbDown"); return; }
  if (lb.kind === "convex" && isOffline){ note("offBoard"); return; }
  let st;
  try { st = await standings(board); }
  catch(e){ if (lb.kind === "convex") await checkOnline(); note(lb.kind === "convex" && isOffline ? "offBoard" : "lbDown2"); return; }
  if (seq !== lbSeq) return;
  const line = (name, isMe, rank, score, b = {}) => `<li class="${isMe ? "me" : ""}"><span class="rk">${rank}</span><span class="nm">${medalCell(rank)}${avatarHTML(isMe && myAvatar ? myAvatar : b.avatar, 24, name)}<bdi>${esc(name || t("player"))}</bdi>${badgeTags(b)}${isMe ? t("youTag") : ""}</span><span class="sc">${+score}</span></li>`;
  let list = st.top.map((r, i) => line(r.name, r.me, i + 1, r.best, r)).join("");
  if (st.me && st.me.rank > st.top.length) list += (st.me.rank > st.top.length + 1 ? `<li class="gap">⋯</li>` : "") + line(st.me.name, true, st.me.rank, st.me.best, st.me);
  const where = st.me ? t("rank", false, st.me.rank, st.count) : !playerName ? t(USE_CONVEX ? "joinUser" : "joinName") : "";
  el.innerHTML = `${where ? `<div class="note">${where}</div>` : ""}${st.top.length ? `<ol>${list}</ol>` : `<div class="note">${t("noScores")}</div>`}`;
}
onTap($("lbbtn"), openBoardSheet);

const avOk = a => /^(ibnbattuta|marcopolo|columbus|zhenghe|earhart|tereshkova|nellybly|captain|fox|panda|lion|penguin|turtle|owl):[0-5]$/.test(a || "");
// one avatar circle; without a chosen avatar it shows the name's first letter on green
function avatarHTML(av, size, name){
  const st = `width:${size}px;height:${size}px;--s:${size}px`;
  if (!avOk(av)) return `<span class="avpic" style="${st};background:linear-gradient(135deg,#2bb673,#1f8a5b);color:#fff;font:800 ${Math.round(size * .45)}px var(--display)">${esc([...(name || "?")][0].toUpperCase())}</span>`;
  const [k, c] = av.split(":"), bg = AV_COLORS[+c];
  if (PORTRAITS[k]) return `<span class="avpic" style="${st};background:color-mix(in srgb,${bg} 30%,#fff)"><svg viewBox="0 0 64 64" aria-hidden="true">${PORTRAITS[k]}</svg></span>`;
  return `<span class="avpic emo" style="${st};background:color-mix(in srgb,${bg} 30%,#fff)">${ANIMALS[k]}</span>`;
}
function setMyAvatar(av, send = true){
  if (!avOk(av)) return;
  myAvatar = av; try { localStorage.setItem(AV_KEY, av); } catch(e){}
  if (typeof settingsOpen === "function" && settingsOpen()) renderSettings();
  if (send && lb.kind === "convex" && playerName && !isOffline) cx("mutation", "scores:setAvatar", { pid: lb.uid, avatar: av }).catch(() => {});
  if (send && lb.kind === "claude" && lb.ready && lb.mine) saveMine({ av });
}
function openAvatarPicker(back = openEditProfile){
  let pick = myAvatar || "ibnbattuta:0";
  const draw = () => {
    const [k, c] = pick.split(":");
    const tile = key => `<button class="tv" data-av="${key}" aria-pressed="${k === key}">${avatarHTML(key + ":" + c, PORTRAITS[key] ? 60 : 46)}${PORTRAITS[key] ? t("tv_" + key) : ""}</button>`;
    $("profile").innerHTML = `<div class="pf" role="dialog" aria-labelledby="pk-t"><button class="grab" id="pfgrab" aria-label="${esc(t("cancel"))}"></button><div class="pick">
      <div class="hd">${avatarHTML(pick, 62)}<div class="nm"><b id="pk-t">${t("chooseAv")}</b><small>${t("avSub")}</small></div></div>
      <h4>${t("avTravellers")}</h4><div class="g4">${TRAVELLERS.map(tile).join("")}</div>
      <h4>${t("avAnimals")}</h4><div class="g6">${Object.keys(ANIMALS).map(tile).join("")}</div>
      <h4>${t("avColour")}</h4><div class="cols">${AV_COLORS.map((col, i) => `<button data-c="${i}" aria-pressed="${+c === i}" aria-label="${i + 1}" style="background:${col}"></button>`).join("")}</div>
      <div class="acts"><button class="btn2" id="pkcancel">${t("cancel")}</button><button class="btn" id="pksave">${t("saveUser")}</button></div></div></div>`;
    $("profile").querySelectorAll("[data-av]").forEach(b => onTap(b, () => { pick = b.dataset.av + ":" + pick.split(":")[1]; draw(); }));
    $("profile").querySelectorAll("[data-c]").forEach(b => onTap(b, () => { pick = pick.split(":")[0] + ":" + b.dataset.c; draw(); }));
    onTap($("pkcancel"), back); onTap($("pfgrab"), back);
    onTap($("pksave"), () => { setMyAvatar(pick); back(); });
  };
  $("profile").hidden = false; draw();
}

const toursKey = () => "globedrop-tours-" + boardKey();
function keepTours(){ try { if (laps > (+localStorage.getItem(toursKey()) || 0)) localStorage.setItem(toursKey(), laps); } catch(e){} }
const fmtClock = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
function showWorldTour(){
  const items = pool(), n = items.length;
  const cName = x => Array.isArray(x) ? x[1] : x.properties.name;
  const strip = shuffle(items.map(cName).filter((v, i, a) => FLAGS[v] && a.indexOf(v) === i)).slice(0, 12);
  stopTimer(); closeSettings?.(); sfx("fanfare", [30, 60, 30, 60, 80]);
  const w = $("wtour");
  w.innerHTML = `<div class="wt" role="dialog" aria-labelledby="wt-h">
    <span class="lap">${t("wtRound", laps)}</span>
    <div class="globe" aria-hidden="true"><img src="${BADGE_WORLD}" alt=""></div>
    <h2 id="wt-h">${t("wt_" + mode)}</h2>
    <p>${t("wtText", fmt(n), t("wtUnit_" + mode, n), laps + 1)}</p>
    <div class="flags" aria-hidden="true">${strip.map(c => `<img src="${FLAGS[c]}" alt="">`).join("")}</div>
    <div class="stats"><div><b>${fmt(n)}</b>${t("wtUnit_" + mode, n)}</div><div><b>❤️ ${lives}</b>${t("wtLives")}</div><div><b>${fmtClock(Date.now() - gameStart)}</b>${t("wtTime")}</div></div>
    <button class="btn" id="wtgo">${t("keepGoing")}</button>
  </div>`;
  w.hidden = false;
  const box = w.querySelector(".wt");
  setTimeout(() => confettiFrom(box, box.querySelector(".globe")), 250);
  onTap($("wtgo"), () => { w.hidden = true; startRound(); });
  setTimeout(() => $("wtgo").focus({preventScroll:true}), 50);
}

const LIST_SIZE = () => ({ flags_easy: FLAG_POOL.length, flags_pro: FLAG_PRO_POOL.length, countries: COUNTRY_POOL.length,
  capitals_easy: CAPITALS_POOL.length, capitals_pro: CAPITALS_PRO_POOL.length, cities_easy: CITIES.length, cities_pro: CITIES.length });
const listSize = b => LIST_SIZE()[b] || 1e9;
const FIRE = [25, 50];
const STREAK_KEY = "globedrop-best-streak";
let knownStreak = 0; // best streak known from the leaderboard, so pop-ups only show for a new record
const localStreak = () => { try { return +localStorage.getItem(STREAK_KEY) || 0; } catch(e){ return 0; } };
function noteStreak(n){
  const before = Math.max(localStreak(), knownStreak);
  if (n > localStreak()) try { localStorage.setItem(STREAK_KEY, n); } catch(e){}
  for (const [i, goal] of FIRE.entries()) if (n === goal && before < goal) achPop("🔥", t("a_fire"), t("inARow", goal), i ? "gold" : "silver");
}
/* progress for the other achievements: kept on the device, sent with each game, the leaderboard keeps the best */
const PROG_KEY = "globedrop-prog", EXPLORED_KEY = "globedrop-explored";
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") ?? d; } catch(e){ return d; } };
let knownProg = {}; // what the leaderboard knows (other devices), so a pop-up only shows the first time
const getProg = () => readJSON(PROG_KEY, {});
const GOALS = { bull: 1, light: 10, explore: 100, untouch: 50, days: 7, langs: 4, allround: 4, pro: 50, cont: 5 };
const BIT_KEYS = ["langs", "cont"]; // kept as bits (one per language / continent), merged with OR
const LANG_BIT = { en: 1, fr: 2, ar: 4, ru: 8 };
const bitCount = n => [1, 2, 4, 8, 16].filter(b => n & b).length;
const progVal = (p, k) => BIT_KEYS.includes(k) ? bitCount(p[k] || 0) : (p[k] || 0);
const ACH_ICON = { bull: "🎯", light: "⚡", explore: "🧭", allround: "🗺️", pro: "🎖️", untouch: "❤️", days: "📅", langs: "🌐", cont: "🎓" };
const ACH_KEY = { bull: "bull", light: "light", explore: "explore", allround: "allround", pro: "pro", untouch: "untouch", days: "daily", langs: "polyglot", cont: "scholar" };
// raise a progress value (languages: add a bit); pop up the first time its goal is reached
function bumpProg(k, v){
  const p = getProg(), before = Math.max(progVal(p, k), progVal(knownProg, k));
  const next = BIT_KEYS.includes(k) ? ((p[k] || 0) | v) : Math.max(p[k] || 0, v);
  if (next === (p[k] || 0)) return;
  p[k] = next; try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch(e){}
  const now = progVal(p, k);
  if (before < GOALS[k] && now >= GOALS[k]) achPop(ACH_ICON[k], t("a_" + ACH_KEY[k]), t("d_" + ACH_KEY[k]), "gold");
}
// computed from the bests kept on this device: games with 10+, best Pro score
function bestsProg(){
  const modes = new Set(), lbs = localBests(); let pro = 0;
  for (const { board, best } of lbs){ if (best >= 10) modes.add(board.split("_")[0]); if (board.endsWith("_pro")) pro = Math.max(pro, best); }
  return { allround: modes.size, pro };
}
function noteBests(before){
  const after = bestsProg(), known = knownProg;
  for (const k of ["allround", "pro"]) if (Math.max(before[k], known[k] || 0) < GOALS[k] && after[k] >= GOALS[k]) achPop(ACH_ICON[k], t("a_" + ACH_KEY[k]), t("d_" + ACH_KEY[k]), "gold");
}
// a finished game counts for the day streak and the language
function noteGamePlayed(){
  const p = getProg(), day = new Date().toLocaleDateString("en-CA"); // YYYY-MM-DD, local time
  if (p.lastDay !== day){
    const y = new Date(Date.now() - 864e5).toLocaleDateString("en-CA");
    p.run = p.lastDay === y ? (p.run || 0) + 1 : 1; p.lastDay = day;
    try { localStorage.setItem(PROG_KEY, JSON.stringify(p)); } catch(e){}
    bumpProg("days", p.run);
  }
  bumpProg("langs", LANG_BIT[LANG] || 0);
}
const progToSend = () => { const p = getProg(), o = {}; for (const k of ["bull", "light", "explore", "untouch", "days", "langs", "cont"]) if (p[k]) o[k] = p[k]; return o; };

function confettiFrom(host, m){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !host || !m) return;
  host.querySelector(".confetti")?.remove();

  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = host.clientWidth, H = host.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--gold", "--pin", "--target", "--ocean", "--ink"].map(v => cs.getPropertyValue(v).trim() || "#c98a12");
  const mr = m.getBoundingClientRect(), hr = host.getBoundingClientRect();
  const ox = mr.left - hr.left + mr.width / 2, oy = mr.top - hr.top + mr.height / 2 + 30;
  const bits = Array.from({length: 110}, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = 5 + Math.random() * 7;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
             w: 5 + Math.random() * 5, h: 8 + Math.random() * 6, c: colors[(Math.random() * colors.length) | 0] };

    const el = now - t0; ctx.clearRect(0, 0, W, H);

      b.vy += .22; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 2400); ctx.translate(b.x, b.y); ctx.rotate(b.r);
