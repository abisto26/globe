<title>Globe by Abisto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen game. Prompt bar on top, full-bleed map, action tray at the bottom. */
:root{
  --ocean:#8fc6ea; --ocean-line:#7ab8e0; --chip:#e9f1f5;
  --land:#f6f0dc; --land-edge:#b3a378; --land-hover:#ece0b8;
  --ink:#16323b; --ink-soft:#4f6b74;
  --panel:#ffffff; --panel-edge:#d6e2e5;
  --pin:#d6402b; --target:#1f8a5b; --gold:#c98a12;
  --btn:#16323b; --btn-ink:#f6fbfc;
  --glass:rgba(255,255,255,.58); --glass-edge:rgba(255,255,255,.75); --glass-shadow:0 10px 30px rgba(20,60,90,.18), inset 0 1px 0 rgba(255,255,255,.6);
  --display:"Bricolage Grotesque", "IBM Plex Sans Arabic", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", "IBM Plex Sans Arabic", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ocean:#0c3a5e; --ocean-line:#134871; --chip:#0a1a22;
  --land:#3a4d40; --land-edge:#6a8a72; --land-hover:#4a6150;
  --ink:#e8f2f3; --ink-soft:#9db5ba;
  --panel:#12232a; --panel-edge:#24414b;
  --pin:#ff6a50; --target:#4fd08e; --gold:#f0b83a;
  --btn:#e8f2f3; --btn-ink:#0f2730; color-scheme:dark;
  --glass:rgba(12,28,38,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}}
:root[data-theme="dark"]{
  --ocean:#0c3a5e; --ocean-line:#134871; --chip:#0a1a22;
  --land:#3a4d40; --land-edge:#6a8a72; --land-hover:#4a6150;
  --ink:#e8f2f3; --ink-soft:#9db5ba;
  --panel:#12232a; --panel-edge:#24414b;
  --pin:#ff6a50; --target:#4fd08e; --gold:#f0b83a;
  --btn:#e8f2f3; --btn-ink:#0f2730; color-scheme:dark;
  --glass:rgba(12,28,38,.55); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ocean);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;position:relative}

/* Top bar */
.glass{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.topwrap{position:absolute;z-index:4;top:10px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top{pointer-events:auto;width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px;padding:12px 16px;border-radius:26px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.headrow{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
.headrow .modes{justify-self:end}
.scorebox{white-space:nowrap}
.controls .theme{width:24px;height:24px}
.controls .theme svg{width:13px;height:13px}
.brand{justify-self:start;min-width:0;font-weight:800;font-size:1.1rem;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.brand svg{width:20px;height:20px;flex:none}
/* loading splash: the logo, big and centred, pulsing softly until the game is ready, then fading out */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,color-mix(in srgb,var(--ocean) 70%,#fff) 0%,var(--ocean) 70%);transition:opacity .45s ease,visibility .45s}
.splash .spin{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px;text-align:center}
.splash img{width:min(58vw,280px);height:auto;filter:drop-shadow(0 14px 28px rgba(10,30,40,.25));animation:splashpulse 1.6s ease-in-out infinite}
.splash{overflow-y:auto}
.splash .spin{margin:auto}
.splash .spbody{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(320px,86vw);opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.splash.ready .spbody{opacity:1;transform:none}
.splash .sptag{margin:0;max-width:300px;font:600 1.02rem/1.4 var(--display);color:var(--ink)}
.splash .sphi{margin:0;font:800 1.25rem var(--display);color:var(--ink);letter-spacing:-.01em}
.splash .langpills{background:color-mix(in srgb,var(--panel) 45%,transparent)}
.splash form{display:flex;flex-direction:column;gap:12px;width:100%}
.splash .namefield{text-align:start}
.splash .namefield input{background:var(--panel)}
.splash .namefield .hint{font-size:.8rem;color:var(--ink-soft)}
.splash .err{color:var(--pin);font-size:.85rem;min-height:0}
.splash .err:empty{display:none}
.splash .spexplore{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:1rem;background:color-mix(in srgb,var(--panel) 55%,transparent)}
.splash .spexplore svg{width:18px;height:18px}
.study{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:14px;border:1px dashed var(--panel-edge);color:var(--ink-soft);font-size:.92rem}
.study button{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;font-size:.9rem}
.study svg{width:16px;height:16px}
.splash .spgo{width:100%;padding:15px 28px;font-size:1.15rem;box-shadow:0 10px 24px rgba(10,30,40,.25)}
.splash.out{opacity:0;visibility:hidden}
.splash.out img{animation:none;transform:scale(1.06);transition:transform .45s ease}
@keyframes splashpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.splash img{animation:none}}
.welcome .hero{display:block;width:min(168px,48%);height:auto;margin:-4px auto 2px;filter:drop-shadow(0 8px 16px rgba(10,30,40,.18));animation:heroin .6s cubic-bezier(.2,1.3,.4,1) both}
@keyframes heroin{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}
.welcome h3{text-align:center}
.modes{display:flex;gap:4px;background:color-mix(in srgb,var(--chip) 55%,transparent);padding:3px;border-radius:999px;min-width:0;max-width:100%;overflow-x:auto;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.modes button{flex:none}
.modes button{border:0;background:transparent;color:var(--ink-soft);font:600 .85rem var(--display);padding:6px 11px;border-radius:999px;cursor:pointer}
.theme{width:36px;height:36px;border-radius:50%;border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 55%,transparent);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.theme svg{width:18px;height:18px}
.theme:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.modes button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* top bar: tabs, then a status row that never moves, then the question in a fixed-height row */
.statusrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px}
.stats{display:flex;align-items:center;gap:12px;font:500 .8rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:600}
.controls{display:flex;align-items:center;gap:6px}
.levels.off,.exploring .stats > *{visibility:hidden}
.prompt{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0;border-top:1px solid var(--glass-edge);padding-top:9px}
.qline{display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;max-width:100%;height:clamp(44px,11vw,58px)}
.qline .place{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qline .place.long{font-size:clamp(1.15rem,4.4vw,1.6rem)}
.qline .hint:empty{display:none}
.qline .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.prompt .label{font:600 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.prompt .place{font-weight:800;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
.prompt .hint{color:var(--ink-soft);font-size:.95rem}
.meta{display:flex;gap:14px;font:500 .8rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:600}
.card.stack{flex-direction:column;align-items:stretch;gap:12px}
.cardrow{display:flex;align-items:center;gap:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--panel) 70%,transparent);color:var(--ink);font:700 1rem var(--display);padding:13px 10px;border-radius:16px;cursor:pointer;text-align:center;line-height:1.2}
.choice:hover:not(:disabled){background:var(--panel)}
.choice:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.choice:disabled{cursor:default}
.choice.right{background:var(--target);color:var(--btn-ink);border-color:transparent}
.choice.wrong{background:var(--pin);color:#fff;border-color:transparent}
.choice.fade{opacity:.45}
.flagimg{display:block;height:clamp(40px,10.5vw,56px);width:auto;aspect-ratio:4/3;border-radius:5px;box-shadow:0 0 0 1px var(--panel-edge),0 4px 12px rgba(10,30,40,.18);max-width:100%}
/* solid, so white or pale flag areas never read as water */
.country.correct.flagged,.easy .country.flagged{fill-opacity:1;stroke:var(--target);stroke-width:2}
@keyframes flagin{from{opacity:0}to{opacity:1}}
#flagfill image{animation:flagin .5s ease-out}
.miniflag{display:inline-block;height:13px;width:auto;aspect-ratio:4/3;border-radius:2px;box-shadow:0 0 0 1px var(--panel-edge);vertical-align:-1px;margin-inline-end:7px}
.langwrap{position:relative;display:inline-flex}
.langbtn{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 55%,transparent);color:var(--ink);font:600 .72rem var(--mono);cursor:pointer}
.langbtn svg{width:14px;height:14px}
.langbtn:focus-visible,.langmenu button:focus-visible,.langpills button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.langmenu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:6;display:flex;flex-direction:column;min-width:130px;padding:6px;border-radius:16px}
.langmenu[hidden]{display:none}
.langmenu button{border:0;background:transparent;color:var(--ink);font:600 .95rem var(--display);text-align:start;padding:9px 12px;border-radius:10px;cursor:pointer}
.langmenu button:hover{background:color-mix(in srgb,var(--chip) 70%,transparent)}
.langmenu button[aria-checked="true"]{background:var(--panel)}
/* compact language switch; always English · Français · العربية in the same places, whatever the page direction */
.langpills{display:inline-flex;align-self:center;gap:2px;background:var(--chip);padding:3px;border-radius:999px}
.langpills button{border:0;background:transparent;color:var(--ink-soft);font:600 .78rem var(--display);padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.langpills button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* Arabic: right to left, and no letter-spacing or capitals (they break joined letters) */
[dir="rtl"]{--mono:"IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif}
[dir="rtl"] *{letter-spacing:0!important}
[dir="rtl"] .prompt .label,[dir="rtl"] .namefield label,[dir="rtl"] .tag{text-transform:none}
[dir="rtl"] .prompt .label{font-size:.85rem}
[dir="rtl"] .list .p,[dir="rtl"] .board li .rk{text-align:left}
[dir="rtl"] .zoomctl{align-self:flex-end}
.modes .m-explore{display:inline-grid;place-items:center;padding:6px 9px}
.modes .m-explore svg{width:16px;height:16px;display:block}
.exploring #levels{visibility:hidden}
.excard{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center}
.excard .exflag{grid-row:span 2;height:56px;width:auto;aspect-ratio:4/3;border-radius:6px;box-shadow:0 0 0 1px var(--panel-edge),0 4px 12px rgba(10,30,40,.18)}
.excard .exname{font:800 1.35rem var(--display);letter-spacing:-.02em;line-height:1.1;min-width:0}
.excard .exrows{display:flex;flex-direction:column;gap:2px;min-width:0}
.excard dl{grid-column:1/-1;margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.95rem}
.excard dt{font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);align-self:center}
.excard dd{margin:0;font-weight:700;min-width:0}
.excard dd.cities{font-weight:500;color:var(--ink-soft)}
.excard .btns{grid-column:1/-1;justify-content:flex-end}
.excard .exnote{grid-column:1/-1;font-size:.85rem;color:var(--ink-soft);line-height:1.35;padding-top:2px}
[dir="rtl"] .excard dt{text-transform:none}
/* first-visit tour: a soft spotlight on the real controls, one short tip at a time */
.tour{position:fixed;inset:0;z-index:30}
.tour[hidden]{display:none}
.tour-ring{position:fixed;border-radius:20px;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 9999px rgba(8,28,38,.42);pointer-events:none;
  transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1),height .35s cubic-bezier(.2,.8,.2,1)}
.tour-tip{position:fixed;width:min(300px,calc(100vw - 24px));padding:16px 16px 14px;border-radius:20px;display:flex;flex-direction:column;gap:6px;background:var(--panel);
  border:1px solid var(--panel-edge);box-shadow:0 14px 40px rgba(10,30,40,.28);transition:left .35s cubic-bezier(.2,.8,.2,1),top .35s cubic-bezier(.2,.8,.2,1);animation:tipin .3s ease-out}
.tour-tip h4{margin:0;font:800 1.08rem var(--display);letter-spacing:-.01em}
.tour-tip p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.4}
.tour-tip .tour-foot{display:flex;align-items:center;gap:10px;margin-top:8px}
.tour-tip .tour-dots{display:flex;gap:5px;margin-inline-end:auto}
.tour-tip .tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--panel-edge)}
.tour-tip .tour-dots i.on{background:var(--ink);width:16px;border-radius:3px}
.tour-tip .btn{padding:9px 18px;font-size:.95rem}
.tour-tip .tour-skip{border:0;background:none;color:var(--ink-soft);font:600 .88rem var(--display);cursor:pointer;padding:6px}
.tour-tip .tour-skip:focus-visible{outline:3px solid var(--pin);outline-offset:2px;border-radius:8px}
@keyframes tipin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.a2hs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:14px;border-radius:16px;background:var(--chip);text-align:start}
.a2hs .ic{grid-row:span 2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--ocean);box-shadow:0 2px 6px rgba(10,30,40,.15)}
.a2hs .ic{overflow:hidden}.a2hs .ic img{display:block;padding:2px;box-sizing:border-box}
.a2hs .ic svg{width:24px;height:24px}
.a2hs b.tt{font:800 .98rem var(--display)}
.a2hs .st{color:var(--ink-soft);font-size:.9rem;line-height:1.4}
.a2hs .st svg{width:15px;height:15px;vertical-align:-2px;margin:0 2px}
.a2hs .st small{display:block;margin-top:4px;font-size:.8rem}
.a2hs .acts{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.a2hs .acts .btn,.a2hs .acts .btn2{padding:8px 16px;font-size:.9rem}
.helpa2hs{display:flex;flex-direction:column;gap:6px}
.helpa2hs p svg{width:15px;height:15px;vertical-align:-2px;margin:0 2px}
.lives{display:flex;gap:3px;align-items:center}
.lives svg{width:17px;height:17px;transition:transform .25s ease}
.lives .on{fill:var(--pin)}
.lives .off{fill:var(--panel-edge);transform:scale(.85)}
.lives .lost{animation:lose .5s ease}
.lives .gain{animation:gain .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes gain{0%{transform:scale(.3)}50%{transform:scale(1.7)}100%{transform:scale(1)}}
/* streak pop-up: drops in under the top bar, then fades away */
.toast{position:absolute;z-index:6;left:50%;top:calc(var(--toastTop,150px));transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;font:700 1rem var(--display);color:var(--ink);white-space:nowrap;
  transition:opacity .25s ease,transform .35s cubic-bezier(.2,1.4,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .th{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--pin) 16%,transparent)}
.toast .th svg{width:20px;height:20px;fill:var(--pin);animation:gain .9s cubic-bezier(.2,1.6,.4,1)}
.toast small{display:block;font:500 .78rem var(--display);color:var(--ink-soft)}
/* end-of-game medal */
.medal{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;margin:-4px 0 2px}
.medal .m{font-size:76px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  filter:drop-shadow(0 8px 14px rgba(150,100,0,.35));animation:medaldrop 1s cubic-bezier(.2,1.5,.4,1) both, medalswing 2.6s ease-in-out 1s infinite alternate;transform-origin:50% 0}
.medal .ml{font:800 1rem var(--display);color:var(--gold);letter-spacing:.01em;animation:fadeup .5s ease .6s both}
@keyframes medaldrop{0%{transform:translateY(-120px) rotate(-25deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes medalswing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:7}
@media (prefers-reduced-motion:reduce){.medal .m,.medal .ml{animation:none}}
@keyframes lose{0%{transform:scale(1.35)}100%{transform:scale(.85)}}

/* Map */
.mapwrap{position:absolute;inset:0}
svg#map{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.graticule{fill:none;stroke:var(--ocean-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.country{fill:var(--land);stroke:var(--land-edge);stroke-width:.5;vector-effect:non-scaling-stroke}
.countries-mode .country{cursor:pointer}
.countries-mode .country:hover{fill:var(--land-hover)}
.country.picked{fill:var(--pin);fill-opacity:.55}
.easy .country{fill-opacity:.4}
.easy .country.focus{fill-opacity:1;stroke:var(--ink-soft);stroke-width:1.2}
.safezone{fill:var(--target);fill-opacity:.12;stroke:var(--target);stroke-width:1.2;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.labelrow{display:flex;align-items:center;gap:8px}
.levels{display:flex;gap:2px;background:color-mix(in srgb,var(--chip) 55%,transparent);padding:2px;border-radius:999px}
.levels button{border:0;background:transparent;color:var(--ink-soft);font:600 .72rem var(--display);padding:3px 10px;border-radius:999px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.levels button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.country.correct{fill:var(--target);fill-opacity:.75}
.guessline{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none;vector-effect:non-scaling-stroke}
.zoomctl{align-self:flex-end;pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.zoomctl button{width:40px;height:40px;border-radius:50%;color:var(--ink);font:600 1.2rem var(--mono);cursor:pointer}

/* Bottom tray */
.tray{position:absolute;left:0;right:0;bottom:0;z-index:3;
  padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
/* the result of a multiple-choice round sits in its own card above the untouched answers */
.resultbar{flex-direction:row;align-items:center;gap:14px;padding:12px 14px 12px 18px;animation:resultin .32s cubic-bezier(.2,1.2,.4,1) both}
.resultbar[hidden]{display:none}
@keyframes resultin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.card{pointer-events:auto;width:100%;max-width:520px;border-radius:26px;
  padding:14px 16px 14px 20px;display:flex;align-items:center;gap:14px}
.card .txt{flex:1;min-width:0}
.card .big{font:600 1.5rem var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .small{color:var(--ink-soft);font-size:.9rem}
.btn{border:0;background:var(--btn);color:var(--btn-ink);font:700 1rem var(--display);padding:12px 22px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.modes button:focus-visible,.zoomctl button:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.bar{height:6px;border-radius:3px;background:var(--chip);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--gold);border-radius:3px;transition:width .6s ease}

/* Results */
.results{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--ocean) 70%,transparent);backdrop-filter:blur(3px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(10,30,40,.25)}
.sheet h2{margin:0;font-size:1rem;font-weight:600;color:var(--ink-soft)}
.total{font:600 3rem var(--mono);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.total small{font-size:1rem;color:var(--ink-soft);letter-spacing:0}
.verdict{font-weight:700;font-size:1.15rem}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none;max-height:min(38vh,320px);overflow:auto}
.list li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:7px 0;border-bottom:1px solid var(--panel-edge);font-size:.95rem}
.list li:last-child{border-bottom:0}
.list .d{font:500 .85rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.list .p{font:600 .9rem var(--mono);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.best{font:500 .8rem var(--mono);color:var(--ink-soft)}
/* welcome + leaderboard */
.welcome h3{margin:0;font-size:1.6rem;letter-spacing:-.03em;line-height:1.1}
.welcome p{margin:0;color:var(--ink-soft);line-height:1.45}
.namefield{display:flex;flex-direction:column;gap:6px}
.namefield label{font:600 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.namefield input{font:700 1.1rem var(--display);color:var(--ink);background:var(--chip);border:1px solid var(--panel-edge);border-radius:14px;padding:12px 14px;width:100%}
.namefield input:focus{outline:3px solid color-mix(in srgb,var(--pin) 55%,transparent);outline-offset:1px}
.namefield .err{color:var(--pin);font-size:.85rem;min-height:1.1em}
/* username + PIN side by side */
.idrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:end}
.idrow .f{display:flex;flex-direction:column;gap:6px;min-width:0}
.idrow input.pin{text-align:center;letter-spacing:.3em;font-variant-numeric:tabular-nums;padding-inline:8px}
.btn[aria-busy="true"]{opacity:.65;pointer-events:none}
/* 15-second timer: a burning fuse along the top of the question. Hottest (yellow) at the flame, embers (red) behind;
   the flame flickers, and burns bigger and faster in the last 3 seconds. */
.timer{position:absolute;top:-2px;left:0;right:0;height:4px;pointer-events:none}
.timer i{position:relative;display:block;height:100%;width:calc(var(--f,0) * 100%);border-radius:4px;opacity:0;
  background:linear-gradient(90deg,#b3200f,#ff4d12 35%,#ff9a1f 75%,#ffd34d);
  box-shadow:0 0 6px rgba(255,110,20,.7),0 0 14px rgba(255,70,0,.3);
  transition:width .12s linear,opacity .3s ease;animation:glow 1.2s ease-in-out infinite}
[dir="rtl"] .timer i{background:linear-gradient(270deg,#b3200f,#ff4d12 35%,#ff9a1f 75%,#ffd34d)}
.timer i::after{content:"🔥";position:absolute;inset-inline-end:-9px;top:50%;font-size:15px;line-height:1;
  transform:translateY(-64%);transform-origin:50% 90%;filter:drop-shadow(0 0 4px rgba(255,140,0,.85));
  animation:flicker .32s ease-in-out infinite alternate}
.timer.on i{opacity:1}
.timer.low i{animation-duration:.5s}
.timer.low i::after{font-size:19px;animation-duration:.16s}
@keyframes glow{50%{box-shadow:0 0 9px rgba(255,140,30,.95),0 0 20px rgba(255,70,0,.45)}}
@keyframes flicker{from{transform:translateY(-64%) scale(.92) rotate(-6deg)}to{transform:translateY(-68%) scale(1.08) rotate(5deg)}}
@media (prefers-reduced-motion: reduce){.timer i,.timer i::after{animation:none}.timer i{transition:opacity .3s ease}}
.board{display:flex;flex-direction:column;gap:6px;background:var(--chip);border-radius:16px;padding:12px 14px}
.board .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.board .bh small{font:500 .78rem var(--mono);color:var(--ink-soft);font-weight:500}
.board ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2.6ch 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:10px;font-variant-numeric:tabular-nums}
.board li .rk{font:600 .85rem var(--mono);color:var(--ink-soft);text-align:right}
.board li .rk .medalrk{font:1.15rem/1 system-ui,sans-serif}
.board .bh .bht{display:inline-flex;align-items:center;gap:7px}
.board li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .sc{font:600 .95rem var(--mono)}
.board li.me{background:color-mix(in srgb,var(--gold) 22%,transparent);font-weight:700}
.board li.gap{display:block;text-align:center;color:var(--ink-soft);padding:0;line-height:1}
.board .note{color:var(--ink-soft);font-size:.88rem}
.who{font-size:.85rem;color:var(--ink-soft);text-align:center}
.who button{border:0;background:none;padding:0;color:var(--ink);font:700 .85rem var(--display);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.list .p.ok{color:var(--target)} .list .p.no{color:var(--pin)}
.card .verdictline{font:800 1.3rem var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .verdictline.ok{color:var(--target)} .card .verdictline.no{color:var(--pin)}
.stat{font:500 .85rem var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.btn2{border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 60%,transparent);color:var(--ink);font:600 .95rem var(--display);padding:11px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn2:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.btns{display:flex;gap:8px;align-items:center}
.tag{display:inline-block;font:600 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:6px}
.tag.miss{background:color-mix(in srgb,var(--pin) 18%,transparent);color:var(--pin)}
.tag.hit{background:color-mix(in srgb,var(--target) 18%,transparent);color:var(--target)}
.meta{align-items:center}
.of{color:var(--ink-soft)}
.how{width:24px;height:24px;border-radius:50%;border:1px solid var(--glass-edge);background:color-mix(in srgb,var(--chip) 55%,transparent);color:var(--ink);font:600 .8rem var(--display);cursor:pointer;padding:0;display:grid;place-items:center}
.how:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
.card .big small{font-size:.85rem;color:var(--ink-soft);letter-spacing:0;font-weight:500}
.linkbtn{border:0;background:none;padding:0;color:var(--ink-soft);font:600 .85rem var(--display);text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:center}
.sheet{max-height:100%;overflow:auto}
/* results: score first, one main action, everything else quiet or folded away */
.rsheet{gap:16px;padding:24px 20px 18px;text-align:center}
.rsheet .rchip{align-self:center;display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:999px;background:var(--chip);color:var(--ink-soft);font:600 .8rem var(--display)}
.rsheet .rhero{display:flex;flex-direction:column;align-items:center;gap:4px}
.rsheet .medal{margin:0}
.rsheet .medal .m{font-size:64px}
.rsheet .rnum{font:800 4rem/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rsheet .rlabel{font:600 1rem var(--display);color:var(--ink-soft)}
.rsheet .rsub{font-size:.88rem;color:var(--ink-soft)}
.rsheet .rsub b{color:var(--ink);font-weight:700}
.rsheet .ractions{display:flex;flex-direction:column;gap:8px}
.rsheet .ractions .btn{padding:14px 22px;font-size:1.05rem}
.rsheet .ractions .btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px}
.rsheet .ractions .btn2 svg{width:17px;height:17px}
.rsheet .board{text-align:start;padding:12px}
.rsheet .board .bh{font-size:.95rem}
.rsheet .board .note{font-size:.85rem}
.rsheet details{text-align:start;border-top:1px solid var(--panel-edge);padding-top:10px}
.rsheet summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 .92rem var(--display);color:var(--ink-soft);padding:4px 2px}
.rsheet summary::-webkit-details-marker{display:none}
.rsheet summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;margin-inline-end:4px}
.rsheet details[open] summary::after{transform:rotate(-135deg)}
.rsheet details .list{margin-top:6px}
.rsheet .rfoot{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--ink-soft);padding-top:2px}
.rsheet .rfoot button{border:0;background:none;padding:0;color:var(--ink-soft);font:600 .82rem var(--display);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* home-screen tip: one quiet row that opens on tap */
.rsheet .a2hs{display:block;padding:0;background:none;border-top:1px solid var(--panel-edge);border-radius:0;padding-top:10px}
.rsheet .a2hs summary{justify-content:flex-start}
.rsheet .a2hs summary .ic{width:26px;height:26px;border-radius:8px;flex:none}
.rsheet .a2hs summary .ic svg{width:16px;height:16px}
.rsheet .a2hs summary .tt{flex:1;font:600 .92rem var(--display);color:var(--ink-soft)}
.rsheet .a2hs .st{margin:8px 2px 0;text-align:start}
.rsheet .a2hs .acts{margin-top:8px}
.sheet p{margin:0;line-height:1.45;color:var(--ink-soft)}
.sheet p b{color:var(--ink)}
.sheet h3{margin:0;font-size:1.35rem;letter-spacing:-.02em}
.scale{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font:500 .85rem var(--mono);font-variant-numeric:tabular-nums}
.scale .meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.scale .meter span{display:block;height:100%;background:var(--gold)}
.scale .pts{text-align:right;font-weight:600;min-width:4ch}

@media (max-width:480px){
  .brand span{display:none}
  .card .big{font-size:1.25rem}
  .meta{gap:10px}
  .modes button{padding:6px 7px;font-size:.78rem}
  .modes .m-explore{padding:6px 7px}
  .headrow{gap:6px}
}
/* most phones (up to ~430px wide): tighten the tab row so all five tabs fit beside the logo */
@media (max-width:380px){
  /* narrow phones: "✓ 4" instead of "Score 4", and a tighter level switch, so the status row always fits */
  .scorebox [data-i18n="score"]{display:none}
  .scorebox b::before{content:"✓ ";color:var(--target);font-weight:700}
  .levels button{padding:3px 7px}
  .controls{gap:4px}
}
@media (max-width:430px){
  .stats{gap:8px}
  .controls{gap:5px}
  .lives svg{width:15px;height:15px}
  .top{padding-left:10px;padding-right:10px}
  .topwrap{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .modes{gap:1px;padding:2px}
  .modes button{padding:6px 6px;font-size:.75rem;letter-spacing:-.01em}
  .modes .m-explore{padding:6px 5px}
  .headrow{gap:4px}
}
/* ---------- tactile feedback: every button squeezes a little when pressed and springs back ---------- */
button,.card,.tray{touch-action:manipulation}
button{-webkit-tap-highlight-color:transparent;transition:transform .14s cubic-bezier(.3,.7,.4,1.5),background-color .2s ease,color .2s ease,box-shadow .2s ease,opacity .2s ease}
button:active:not(:disabled){transform:scale(.92);transition-duration:.06s}
.btn:active:not(:disabled),.btn2:active:not(:disabled),.choice:active:not(:disabled){transform:scale(.96)}
.modes button:active:not(:disabled),.levels button:active:not(:disabled),.langpills button:active:not(:disabled){transform:scale(.9)}
/* answers react: the right one pops, a wrong pick shakes, the verdict slides in */
.choice.right{animation:answerpop .5s cubic-bezier(.2,1.6,.4,1)}
.choice.wrong{animation:answershake .42s ease}
.verdictline{animation:fadeup .3s ease both}
.lock-pop{animation:answerpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes answerpop{0%{transform:scale(.9)}55%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes answershake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.pinmark{animation:drop .22s ease-out}
</style>

const FLAGS = __FLAGS__; // country name on the map → flag image (SVG, 4:3)
const flagImg = (name, cls) => FLAGS[name] ? `<img class="${cls}" src="${FLAGS[name]}" alt="">` : "";

const LIVES = 3;       // misses allowed before the game ends
const PRO_MISS_KM = 1000; // Cities · Pro: a pin further than this costs a life
/* Cities · Easy: the map zooms to the country, and the safe distance scales with the country's size */
const easyMissKm = sizeKm => Math.round(Math.min(400, Math.max(75, sizeKm * 0.25)) / 5) * 5;
const TOPO_NAME = {"United States":"United States of America","Türkiye":"Turkey","DR Congo":"Dem. Rep. Congo"};
const isPhone = () => window.innerWidth < 600;
const $ = id => document.getElementById(id);

/* ---------- map ---------- */
const svg = d3.select("#map");
const gZoom = svg.append("g");
const gBase = gZoom.append("g");
const gMarks = gZoom.append("g");
/* After a Flags answer, the right country is painted with its flag, fitted to its main landmass */
const flagPattern = svg.append("defs").append("pattern").attr("id", "flagfill").attr("patternUnits", "userSpaceOnUse");
const flagPatternImg = flagPattern.append("image").attr("preserveAspectRatio", "none");
/* Safari draws an SVG image with its own aspect ratio and ignores preserveAspectRatio="none" on <image>,
   leaving gaps around the flag. So the copy used to fill a country says "stretch" inside the flag file itself. */
const stretchedFlags = {};
function stretchFlag(name){
  if (stretchedFlags[name]) return stretchedFlags[name];
  const uri = FLAGS[name] || "";
  try {
    const bin = atob(uri.slice(uri.indexOf(",") + 1));
    const svgText = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)))
      .replace(/<svg\b(?![^>]*preserveAspectRatio)/, '<svg preserveAspectRatio="none"');
    return stretchedFlags[name] = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
  } catch(e){ return uri; }
}
/* Morocco is drawn as one shape: its geometry is merged with the W. Sahara polygon so no inner border shows. */
const MERGE_INTO = {"Morocco": ["Morocco", "W. Sahara"]};
const mergedAway = new Set(Object.values(MERGE_INTO).flat());
const countries = topojson.feature(TOPO, TOPO.objects.countries).features
  .filter(f => f.properties.name !== "Antarctica" && !mergedAway.has(f.properties.name))
  .concat(Object.entries(MERGE_INTO).map(([name, parts]) => ({
    type: "Feature", id: name, properties: {name},
    geometry: topojson.merge(TOPO, TOPO.objects.countries.geometries.filter(g => parts.includes(g.properties.name)))
  })));
const projection = d3.geoNaturalEarth1();
const path = d3.geoPath(projection);
let k = 1;

const zoom = d3.zoom().scaleExtent([1, 40]).clickDistance(6)
  .on("zoom", e => { k = e.transform.k; gZoom.attr("transform", e.transform); sizeMarks(); });
svg.call(zoom).on("dblclick.zoom", null);

function layout(){
  const r = $("mapwrap").getBoundingClientRect();
  const topH = $("top").getBoundingClientRect().bottom - r.top;
  const topPad = topH + 12, botPad = Math.max(isPhone() ? 110 : 100, trayH());
  svg.attr("viewBox", `0 0 ${r.width} ${r.height}`);
  projection.fitExtent([[10, topPad], [r.width - 10, r.height - botPad]], {type:"Sphere"});
  zoom.translateExtent([[-r.width*0.25, -r.height*0.25],[r.width*1.25, r.height*1.25]]);
  gBase.selectAll("*").remove();
  gBase.append("path").attr("class","graticule").attr("d", path(d3.geoGraticule10()));
  gBase.selectAll(".country").data(countries).join("path")
    .attr("class","country").attr("d", path)
    .on("click", (e, d) => { if (tapsCountry()) { e.stopPropagation(); if (mode === "explore") exploreCountry(d); else guessCountry(d); } });
  paintCountries();
  redrawMarks();
  // the projection changed, so the old zoom no longer points at the same place
  if (mode === "explore" && current) focusBounds(safeBounds(mainShape(current)), 20, 0.6, 0);
  else if (current && area && (!revealed || mode === "capitals")) focusBounds(safeBounds(area.shape), 30, 0.8, 0);
  else svg.call(zoom.transform, d3.zoomIdentity);
}
/* Bounds on the flat map. A few countries cross the 180° line (Russia's Chukotka, Fiji, the Aleutians), and the
   piece past it is drawn at the opposite edge, which would make the shape look as wide as the world.
   When that happens, measure only the points on the same side of the 180° line as the shape's centre. */
function safeBounds(obj){
  const b = path.bounds(obj), sphere = path.bounds({type:"Sphere"});
  if (b[1][0] - b[0][0] < 0.5 * (sphere[1][0] - sphere[0][0])) return b;
  const pts = [];
  const walk = c => typeof c[0] === "number" ? pts.push(c) : c.forEach(walk);
  const geoms = obj.type === "FeatureCollection" ? obj.features.map(f => f.geometry || f) : [obj.geometry || obj];
  geoms.forEach(g => g && g.coordinates && walk(g.coordinates));
  const east = d3.geoCentroid(obj)[0] >= 0;
  const xy = pts.filter(p => east ? p[0] > -90 : p[0] < 90).map(p => projection(p)).filter(Boolean);
  if (!xy.length) return b;
  return [[d3.min(xy, q => q[0]), d3.min(xy, q => q[1])], [d3.max(xy, q => q[0]), d3.max(xy, q => q[1])]];
}
function setFlagPattern(f){
  const g = f.geometry;
  const main = g.type === "MultiPolygon"
    ? g.coordinates.map(c => ({type:"Polygon", coordinates:c})).reduce((a, b) => d3.geoArea(a) > d3.geoArea(b) ? a : b)
    : g;
  const [[x0, y0], [x1, y1]] = safeBounds(main);
  const w = Math.max(x1 - x0, 1), h = Math.max(y1 - y0, 1);
  flagPattern.attr("x", x0).attr("y", y0).attr("width", w).attr("height", h);
  const src = stretchFlag(f.properties.name);
  if (flagPatternImg.attr("href") !== src) flagPatternImg.attr("href", src);
  // Cover the whole shape. The flag may stretch up to 2x to match the shape, so every stripe stays visible
  // (Russia is very wide, Chile very tall); only beyond that is it cropped, centred.
  const flagAR = 4 / 3, minAR = flagAR / 2, maxAR = flagAR * 2, ar = w / h;
  let iw = w, ih = h;
  if (ar > maxAR) ih = w / maxAR;
  else if (ar < minAR) iw = h * minAR;
  flagPatternImg.attr("x", (w - iw) / 2).attr("y", (h - ih) / 2).attr("width", iw).attr("height", ih);
}
function paintCountries(){
  const showFlag = (mode === "flags" || mode === "countries" || mode === "explore") && revealed && current && !!FLAGS[current.properties?.name];
  if (showFlag) setFlagPattern(current);
  gBase.selectAll(".country")
    .classed("flagged", f => showFlag && f === current)
    .style("fill", f => showFlag && f === current ? "url(#flagfill)" : null)

    .classed("picked", f => f === pickedF)
    .classed("correct", f => (mode === "countries" || mode === "flags" || mode === "explore") && revealed && f === current);
}

function pinPath(color){
  return `<path d="M0 0 C-2 -5 -7 -9 -7 -14 a7 7 0 0 1 14 0 C7 -9 2 -5 0 0z" fill="${color}" stroke="var(--panel)" stroke-width="1.5"/><circle cy="-14" r="2.6" fill="var(--panel)"/>`;
}
function redrawMarks(){
  gMarks.selectAll("*").remove();
  if (revealed && answerLL && mode === "cities"){
    gMarks.append("path").attr("class","safezone")
      .attr("d", path(d3.geoCircle().center(answerLL).radius(missKm / 6371 * 180 / Math.PI)()));
  }
  if (revealed && guess && answerLL){
    gMarks.append("path").attr("class","guessline")
      .attr("d", path({type:"LineString", coordinates:[guess, answerLL]}));
  }
  if (revealed && answerLL){
    const [x,y] = projection(answerLL);
    gMarks.append("g").attr("class","mark pinmark").attr("data-x",x).attr("data-y",y).html(pinPath("var(--target)"));
  }
  if (guess && mode === "cities"){
    const [x,y] = projection(guess);
    gMarks.append("g").attr("class","mark pinmark").attr("data-x",x).attr("data-y",y).html(pinPath("var(--pin)"));
  }
  sizeMarks();
}
function sizeMarks(){
  gMarks.selectAll(".mark").attr("transform", function(){
    return `translate(${this.dataset.x},${this.dataset.y}) scale(${1.25/k})`;
  });
}

function renderCard(focus = true){

  // put the result card away AND empty it, so its old Next/Stop buttons can't be picked up instead of the visible ones
  if (!(isChoiceRound() && revealed && mode !== "explore")) { $("resultbar").hidden = true; $("resultbar").innerHTML = ""; }
  if (mode === "explore") return renderExploreCard(c);
  c.classList.toggle("stack", isChoiceRound());
  if (isChoiceRound()) return renderChoiceCard(c, focus);
  if (!revealed){
    if (mode === "cities"){
      c.innerHTML = `<div class="txt"><div class="small">${guess ? t("tapMove") : t("tapPin")}</div><div class="small">${t("safeKm", fmt(missKm))}</div></div>
        <button class="btn" id="lock" ${guess?"":"disabled"}>${t("lockIn")}</button>`;
      onTap($("lock"), reveal);
    } else {
      c.innerHTML = `<div class="txt"><div class="small">${mode === "flags" ? t("tapCountryFlag") : t("tapCountry")}</div><div class="small">${t("wrongCountry")}</div></div>`;
    }
    return;
  }
  const r = results[results.length-1];
  const last = lives === 0;
  const km = fmt(Math.round(r.km));
  const msg = r.timeout ? t("hereIs", mode === "cities" ? placeName(r.key) : countryName(r.key)) : mode === "cities"
    ? (r.km < 1 ? t("rightOnIt") : t("pinFrom", km, placeName(r.key)))
    : (r.km < 1 ? t("rightCountry") : t("tappedFrom", countryName(r.picked), km, countryName(r.key)));
  c.innerHTML = `<div class="txt">${resultLine(r, last)}<div class="small">${esc(msg)}</div></div>` + nextButtons(last);
  wireNext(last, focus);
}

function resultLine(r, last){
  if (!r.miss) return `<div class="verdictline ok">${t("right")} <span class="tag hit">+1</span></div>`;
  return `<div class="verdictline no">${r.timeout ? t("timesUp") : t("miss")} <span class="tag miss">${last ? t("outOfLives") : t("minusLife")}</span></div>`;
}
function renderChoiceCard(c, focus){
  if (!revealed){
    const hint = mode === "flags" ? t("hintFlags") : level === "pro" ? t("hintCapPro") : t("hintCap");
    c.innerHTML = choiceButtons() + `<div class="small">${hint}</div>`;
    c.querySelectorAll(".choice").forEach(b => onTap(b, () => pickCapital(choices[+b.dataset.i])));
    return;
  }
  const r = results[results.length-1];
  const last = lives === 0;
  const msg = r.timeout ? (mode === "flags" ? t("flagHit", countryName(r.key)) : t("capHit", placeName(r.key), countryName(current[1]))) : mode === "flags"
    ? (r.miss ? t("flagMiss", countryName(r.key), countryName(r.picked)) : t("flagHit", countryName(r.key)))
    : (r.miss ? t("capMiss", placeName(r.key), countryName(current[1]), level === "pro" ? placeName(r.picked) : "") : t("capHit", placeName(r.key), countryName(current[1])));
  const hint = mode === "flags" ? t("hintFlags") : level === "pro" ? t("hintCapPro") : t("hintCap");
  c.innerHTML = choiceButtons() + `<div class="small">${hint}</div>`;
  const rb = $("resultbar");
  rb.innerHTML = `<div class="txt">${resultLine(r, last)}<div class="small">${esc(msg)}</div></div>${nextButtons(last)}`;
  rb.hidden = false;
  wireNext(last, focus);
}
/* Results keep stable keys (English place names, map country names) and are worded at display time,
   so switching language mid-game re-labels everything without changing what was answered. */
function pickCapital(name){
  if (revealed) return;
  stopTimer();
  chosen = name;
  const ok = name === rightAnswer();
  if (mode === "flags"){
    pickedF = ok ? null : FLAG_POOL.find(f => f.properties.name === name);
    results.push({kind:"country", key: current.properties.name, flag: current.properties.name, picked: name, km: 0, miss: !ok});
  } else {
    answerLL = [current[3], current[2]];
    results.push({kind:"place", key: current[0], picked: name, pickedKind:"place", km: 0, miss: !ok});
  }
  afterAnswer(!ok);
  revealed = true; paintCountries(); redrawMarks(); renderTop(); renderCard();
  if (mode === "flags") focusFeatures(current, pickedF);
  else focusBounds(safeBounds(area.shape), 30, 0.8);
}
function reveal(){
  if (!guess || revealed) return;
  stopTimer();
  answerLL = [current[3], current[2]];
  const km = kmBetween(guess, answerLL);
  const miss = km > missKm;
  results.push({kind:"place", key: current[0], km, miss, dist: true});
  afterAnswer(miss);
  revealed = true; redrawMarks(); renderTop(); renderCard();
  if (level === "easy") focusBounds(safeBounds(d3.geoCircle().center(answerLL).radius(Math.max(missKm, km) * 1.15 / 6371 * 180 / Math.PI)()), 30, 0.85);
  else focusPair(guess, answerLL);
}
function guessCountry(d){
  if (revealed) return;
  stopTimer();
  const correct = d === current;
  const km = correct ? 0 : kmBetween(d3.geoCentroid(d), d3.geoCentroid(current));
  results.push({kind:"country", key: current.properties.name, flag: mode === "flags" ? current.properties.name : null, picked: d.properties.name, km, miss: !correct});
  afterAnswer(!correct);
  pickedF = correct ? null : d;
  revealed = true; paintCountries(); renderTop(); renderCard();
  if (!correct) focusFeatures(d, current);
  else focusFeatures(current);
}

function focusBounds(b, maxK = 6, fill = 0.7, ms = 600){
  const r = $("mapwrap").getBoundingClientRect();
  const [[x0,y0],[x1,y1]] = b;
  const w = Math.max(x1-x0, 4), h = Math.max(y1-y0, 4);
  const topH = $("top").getBoundingClientRect().bottom - r.top;
  const availH = r.height - topH - Math.max(isPhone()?120:110, trayH());
  const s = Math.max(1, Math.min(maxK, fill / Math.max(w / r.width, h / availH)));
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const tr = d3.zoomIdentity.translate(r.width/2 - s*cx, topH + availH/2 - s*cy).scale(s);
  if (ms) svg.transition().duration(ms).call(zoom.transform, tr); else svg.interrupt().call(zoom.transform, tr);
}
function focusPair(a, b){
  const p = projection(a), q = projection(b);
  focusBounds([[Math.min(p[0],q[0]),Math.min(p[1],q[1])],[Math.max(p[0],q[0]),Math.max(p[1],q[1])]]);
}
/* the biggest piece of a country, so overseas bits (French Guiana, Alaska) don't zoom the map out */
function mainShape(f){
  const g = f.geometry;
  if (g.type !== "MultiPolygon") return f;
  return {type:"Feature", geometry: g.coordinates.map(c => ({type:"Polygon", coordinates:c})).reduce((x, y) => d3.geoArea(x) > d3.geoArea(y) ? x : y)};
}
function focusFeatures(a, b){
  focusBounds(safeBounds({type:"FeatureCollection", features:[a, b].filter(Boolean).map(mainShape)}));
}

function verdict(n){
  const v = t("verdicts");
  return v[n >= 30 ? 4 : n >= 20 ? 3 : n >= 10 ? 2 : n >= 4 ? 1 : 0];
}
/* ---------- player name + leaderboard ----------
   Each player has one shared document, scores/<their id>, holding their name and their best score per board.
   Everyone signed in can read all of them; each player can only write their own (rules set at publish). */
const NAME_KEY = "globedrop-name";
let playerName = "";
try { playerName = localStorage.getItem(NAME_KEY) || ""; } catch(e){}
let lb = { kind: "", db: null, uid: null, mine: null, ready: false, off: false };
/* Two leaderboard backends:
   - inside claude.ai: the artifact's shared database (claude.use("db"));
   - anywhere else (GitHub Pages): Convex, through its HTTP API. build.js fills in the URL. */
const CONVEX_URL = "__CONVEX_URL__";
const PID_KEY = "globedrop-pid";
const USE_CONVEX = !window.claude?.use && /^https:\/\//.test(CONVEX_URL);
const cleanUser = s => String(s || "").normalize("NFKC").replace(/[^\p{L}\p{N}_.\-]/gu, "").slice(0, 16);
const BOARDS = ["flags_easy", "flags_pro", "countries", "capitals_easy", "capitals_pro", "cities_easy", "cities_pro"];
// the best kept on this device for each board (saved by showResults even without a username)
function localBests(){
  const out = [];
  for (const b of BOARDS){
    let v = 0; try { v = +localStorage.getItem("globedrop-right-best-" + b.replace("_", "-")) || 0; } catch(e){}
    if (v > 0) out.push({ board: b, best: v });
  }
  return out;
}
async function syncLocalBests(){
  if (lb.kind !== "convex" || !playerName) return;
  const scores = localBests(); if (!scores.length) return;
  try { await cx("mutation", "scores:submit", { pid: lb.uid, scores }); } catch(e){}
}
/* Create, rename or sign in to a username. Returns an error message, or "" when done. */
async function claimUsername(raw, pin){
  const name = cleanUser(raw);
  if (name.length < 3) return t("userErr");
  if (!/^\d{4}$/.test(pin)) return t("pinErr");
  let res;
  try { res = await cx("mutation", "scores:claim", { pid: lb.uid, username: name, pin }); }
  catch(e){ return t("netErr"); }
  if (!res.ok) return res.reason === "wrong_pin" ? t("wrongPin") : res.reason === "locked" ? t("lockedErr", res.wait || 10)
    : res.reason === "bad_pin" ? t("pinErr") : t("userErr");
  lb.uid = res.pid; playerName = res.name;
  try { localStorage.setItem(PID_KEY, res.pid); localStorage.setItem(NAME_KEY, res.name); } catch(e){}
  boardCache = null;
  await syncLocalBests();
  return "";
}
const idFields = (pre, typed) => `<div class="idrow">
    <div class="f"><label for="${pre}name">${t("userLabel")}</label>
      <input id="${pre}name" type="text" maxlength="16" placeholder="${esc(t("userPh"))}" value="${esc(typed)}" autocapitalize="none" autocomplete="username" spellcheck="false" dir="auto"></div>
    <div class="f"><label for="${pre}pin">${t("pinLabel")}</label>
      <input id="${pre}pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="current-password" enterkeyhint="go"></div>
  </div>`;
async function cx(kind, path, args){
  const r = await fetch(CONVEX_URL.replace(/\/$/, "") + "/api/" + kind, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path, args, format: "json" }),
  });
  const j = await r.json();
  if (j.status !== "success") throw new Error(j.errorMessage || "convex error");
  return j.value;
}
const boardKey = () => mode + (mode !== "countries" ? "_" + level : "");
const boardTitle = () => mode === "countries" ? t("m_countries") : t("m_" + mode) + " · " + t(level);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const cleanName = s => String(s || "").replace(/[^\p{L}\p{N} _.\-]/gu, "").replace(/\s+/g, " ").trim().slice(0, 16);

(async () => {
  try {
    if (!window.claude?.use){
      if (!/^https:\/\//.test(CONVEX_URL)) { lb.off = true; return; }
      // a random id for this device; it stays private (the server never sends ids back)
      let pid = ""; try { pid = localStorage.getItem(PID_KEY) || ""; } catch(e){}
      if (!/^[a-z0-9]{20,40}$/.test(pid)){
        pid = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
        try { localStorage.setItem(PID_KEY, pid); } catch(e){}
      }
      Object.assign(lb, { kind: "convex", uid: pid, mine: {}, ready: true });
      // check the username this device thinks it has; names from the first version (no PIN) need setting again
      try {
        const me = await cx("query", "scores:me", { pid });
        if (me){ if (me.name !== playerName){ playerName = me.name; try { localStorage.setItem(NAME_KEY, me.name); } catch(e){} } syncLocalBests(); }
        else if (playerName){ playerName = ""; if (splashOpen){ splashAsk = true; renderSplash(); } }
      } catch(e){}
      return;
    }
    lb.kind = "claude";
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) { lb.off = true; return; }
    lb.db = db; lb.uid = uid;
    const snap = await db.doc("scores/" + uid).get();
    lb.mine = snap.exists ? snap.data() : null;
    lb.ready = true;
    // a name saved on another device wins over an empty one here
    if (!playerName && !FRESH && lb.mine?.name){ playerName = lb.mine.name; try { localStorage.setItem(NAME_KEY, playerName); } catch(e){} closeWelcome(); if (splashOpen && !($("spname")?.value)) { splashAsk = false; renderSplash(); } }
  } catch(e){ lb.off = true; }
})();

async function saveMine(patch){
  if (!lb.ready) return false;
  if (lb.kind === "convex") return false; // usernames go through claimUsername; scores through refreshBoard
  const next = Object.assign({}, lb.mine || {}, patch, { name: playerName || "Player", updated: Date.now() });
  try { await lb.db.doc("scores/" + lb.uid).set(next); lb.mine = next; return true; }
  catch(e){ if (e?.code === "invalid_argument") lb.off = true; return false; }
}

/* Read the current board once, save a new best, and draw the standings. */
let boardSeq = 0, boardCache = null;
async function refreshBoard(total){
  const el = $("board"); if (!el) return;
  const seq = ++boardSeq, field = "b_" + boardKey();
  if (lb.off || (!lb.ready && !window.claude?.use)){
    el.innerHTML = `<div class="note">${t("lbSignin")}</div>`; return;
  }
  el.innerHTML = `<div class="bh">${lbTitle()} <small>${esc(boardTitle())}</small></div><div class="note">${t("loading")}</div>`;
  const t0 = Date.now();
  while (!lb.ready && !lb.off && Date.now() - t0 < 10000) await new Promise(r => setTimeout(r, 200));
  if (seq !== boardSeq) return;
  if (!lb.ready){ el.innerHTML = `<div class="note">${t("lbDown")}</div>`; return; }
  if (lb.kind === "convex"){
    const board = boardKey();
    let newBest = false, res;
    if (typeof total === "number" && total > 0 && playerName){
      try { newBest = ((await cx("mutation", "scores:submit", { pid: lb.uid, scores: [{ board, best: total }] })).newBest || []).includes(board); } catch(e){}
    }
    try { res = await cx("query", "scores:board", { board, pid: lb.uid }); }
    catch(e){ if (seq === boardSeq) el.innerHTML = `<div class="note">${t("lbDown2")}</div>`; return; }
    if (seq !== boardSeq) return;
    boardCache = { convex: res, board, newBest: newBest || (boardCache?.newBest && boardCache.board === board) };
    drawBoard(); return;
  }
  let newBest = false;
  if (typeof total === "number" && total > 0 && playerName && total > (+lb.mine?.[field] || 0)){
    newBest = await saveMine({ [field]: total, ["t_" + boardKey()]: Date.now() });
  }
  let docs = [];
  try { docs = (await lb.db.collection("scores").orderBy(field, "desc").limit(500).get()).docs; }
  catch(e){ if (seq === boardSeq) el.innerHTML = `<div class="note">${t("lbDown2")}</div>`; return; }
  if (seq !== boardSeq) return;
  const rows = docs.map(d => ({ id: d.id, ...d.data() })).filter(r => +r[field] > 0)
    .sort((a, b) => (+b[field] - +a[field]) || ((+a["t_" + boardKey()] || 0) - (+b["t_" + boardKey()] || 0)));
  boardCache = { rows, field, newBest: newBest || boardCache?.newBest && boardCache.field === field };
  drawBoard();
}
/* 🥇🥈🥉 for the podium, numbers after that */
const rankMark = r => r <= 3 ? `<span class="medalrk" role="img" aria-label="${r}">${["🥇", "🥈", "🥉"][r - 1]}</span>` : r;
const lbTitle = () => `<span class="bht"><span aria-hidden="true">🏆</span>${t("leaderboard")}</span>`;
function drawBoard(){
  const el = $("board"); if (!el || !boardCache) return;
  if (boardCache.convex){
    const { top, me, count } = boardCache.convex;
    const line = (name, isMe, rank, score) => `<li class="${isMe ? "me" : ""}"><span class="rk">${rankMark(rank)}</span><span class="nm"><bdi>${esc(name || t("player"))}</bdi>${isMe ? t("youTag") : ""}</span><span class="sc">${+score}</span></li>`;
    let list = top.map((r, i) => line(r.name, r.me, i + 1, r.best)).join("");
    if (me && me.rank > top.length) list += (me.rank > top.length + 1 ? `<li class="gap">⋯</li>` : "") + line(me.name, true, me.rank, me.best);
    const where = !playerName ? t("joinUser") : me ? t("rank", boardCache.newBest, me.rank, count) : t("joinOne");
    document.querySelector(".sheet .best")?.setAttribute("hidden", "");
    el.innerHTML = `<div class="bh">${lbTitle()}</div>
      <div class="note">${where}</div>
      ${top.length ? `<ol>${list}</ol>` : `<div class="note">${t("noScores")}</div>`}`;
    return;
  }
  const { rows, field, newBest } = boardCache;
  const meIdx = rows.findIndex(r => r.id === lb.uid);
  const line = (r, i) => `<li class="${r.id === lb.uid ? "me" : ""}"><span class="rk">${rankMark(i + 1)}</span><span class="nm"><bdi>${esc(r.name || t("player"))}</bdi>${r.id === lb.uid ? t("youTag") : ""}</span><span class="sc">${+r[field]}</span></li>`;
  const TOP = 5;
  let list = rows.slice(0, TOP).map(line).join("");
  if (meIdx >= TOP) list += (meIdx > TOP ? `<li class="gap">⋯</li>` : "") + line(rows[meIdx], meIdx);
  const where = !playerName ? t("joinName") : meIdx >= 0 ? t("rank", newBest, meIdx + 1, rows.length) : t("joinOne");
  document.querySelector(".sheet .best")?.setAttribute("hidden", "");
  el.innerHTML = `<div class="bh">${lbTitle()}</div>
    <div class="note">${where}</div>
    ${rows.length ? `<ol>${list}</ol>` : `<div class="note">${t("noScores")}</div>`}`;
}

const MEDAL_AT = 3; // right answers needed for the end-of-game medal
/* A short confetti burst from the medal, drawn on a canvas over the results; skipped when the viewer prefers less motion. */
function celebrate(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const host = $("results"), m = host.querySelector(".medal .m"); if (!m) return;
  host.querySelector(".confetti")?.remove();
  const cv = document.createElement("canvas"); cv.className = "confetti"; host.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2), W = host.clientWidth, H = host.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const colors = ["--gold", "--pin", "--target", "--ocean", "--ink"].map(v => cs.getPropertyValue(v).trim() || "#c98a12");
  const mr = m.getBoundingClientRect(), hr = host.getBoundingClientRect();
  const ox = mr.left - hr.left + mr.width / 2, oy = mr.top - hr.top + mr.height / 2 + 30;
  const bits = Array.from({length: 110}, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.1, v = 5 + Math.random() * 7;
    return { x: ox, y: oy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
             w: 5 + Math.random() * 5, h: 8 + Math.random() * 6, c: colors[(Math.random() * colors.length) | 0] };
  });
  const t0 = performance.now();
  (function frame(now){
    const el = now - t0; ctx.clearRect(0, 0, W, H);
    for (const b of bits){
      b.vy += .22; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - el / 2400); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 2))); ctx.restore();
    }
    if (el < 2400 && cv.isConnected) requestAnimationFrame(frame); else cv.remove();
  })(t0 + 400 > performance.now() ? t0 : performance.now());
}
/* ---------- add to home screen ----------
   Browsers don't let a page add itself, so on phones we show the exact steps once, after the first finished game.
   Where the browser offers its own install prompt (Android Chrome on a hosted copy), the card gets an Install button. */
const A2HS_KEY = "globedrop-a2hs";
const UA = navigator.userAgent || "";
const isIOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(UA);
const isStandalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });
function a2hsSteps(){
  if (isIOS) return `${t("a2hsIOS")}<small>${t("a2hsIOSNote")}</small>`;
  if (isAndroid) return `${t("a2hsAndroid")}<small>${t("a2hsAndroidNote")}</small>`;
  return "";
}
function shouldOfferA2hs(){
  if (isStandalone || !(isIOS || isAndroid || installEvt)) return false;
  try { return !localStorage.getItem(A2HS_KEY); } catch(e){ return false; }
}
const APP_ICON = `<img src="${document.querySelector(".splash img")?.src || ""}" alt="" style="width:100%;height:100%;object-fit:contain">`; // the game logo, read from the splash
function a2hsCard(){
  return `<details class="a2hs" id="a2hs">
    <summary><span class="ic">${APP_ICON}</span><span class="tt">${t("a2hsTitle")}</span></summary>
    <div class="st">${installEvt ? t("a2hsWhy") : a2hsSteps()}</div>
    <div class="acts">${installEvt ? `<button class="btn2" id="a2hs-no">${t("notNow")}</button><button class="btn" id="a2hs-yes">${t("install")}</button>` : `<button class="btn2" id="a2hs-no">${t("gotIt2")}</button>`}</div>
  </details>`;
}
function wireA2hs(){
  const done = () => { try { localStorage.setItem(A2HS_KEY, "1"); } catch(e){} $("a2hs")?.remove(); a2hsShown = false; };
  $("a2hs-no") && ($("a2hs-no").onclick = done);
  $("a2hs-yes") && ($("a2hs-yes").onclick = async () => { try { installEvt.prompt(); await installEvt.userChoice; } catch(e){} installEvt = null; done(); });
}
let a2hsShown = false;

const STUDY_BELOW = 5; // suggest Explore on the results screen below this many right answers
let lastOutcome = null; // {outOfLives, total, best, newBest}
function showResults(outOfLives){
  const total = results.filter(r => !r.miss).length;
  const key = "globedrop-right-best-" + mode + (mode !== "countries" ? "-" + level : "");
  let best = 0;
  try { best = +localStorage.getItem(key) || 0; if (total > best) localStorage.setItem(key, total); } catch(e){}
  lastOutcome = { outOfLives, total, best, newBest: total > best };
  a2hsShown = shouldOfferA2hs();
  boardCache = null;
  clearTimeout(toastTimer); $("toast").classList.remove("show");
  renderResults();
  refreshBoard(total);
  if (total >= MEDAL_AT) celebrate();
  $("again").focus({preventScroll:true});
}
function resultName(r){ return r.kind === "place" ? placeName(r.key) : countryName(r.key); }
function resultDetail(r){
  if (r.timeout) return "⏱ " + t("timeoutTag");
  if (r.dist) return r.km < 1 ? t("spotOn") : t("kmOff", fmt(Math.round(r.km)));
  if (!r.miss) return "";
  return t("you", r.pickedKind === "place" ? placeName(r.picked) : countryName(r.picked));
}
function renderResults(){
  if (!lastOutcome) return;
  const { outOfLives, total } = lastOutcome;
  const played = results.length, missed = played - total;
  $("results").innerHTML = `<div class="sheet rsheet" role="dialog" aria-label="${esc(t("seeResults"))}">
    <span class="rchip">${esc(boardTitle())}</span>
    <div class="rhero">
      ${total >= MEDAL_AT ? `<div class="medal" role="img" aria-label="${esc(t("medal"))}"><div class="m">🏅</div></div>` : ""}
      <div class="rnum">${total}</div>
      <div class="rlabel">${t("rightAnswers", total)}</div>
    </div>
    <div class="rsub"><b>${verdict(total)}</b><br>${outOfLives ? t("outOfLives") : t("youStopped")} · ${t("playedMissed", played, missed)}</div>
    <div class="ractions">
      <button class="btn" id="again">${t("playAgain")}</button>
      ${total < STUDY_BELOW ? `<button class="btn2" id="study"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>${t("studyBtn2")}</button>` : ""}
    </div>
    <div class="board" id="board"></div>
    ${played ? `<details class="answers"><summary>${t("yourAnswers", played)}</summary>
      <ul class="list">${results.map(r=>`<li class="${r.miss ? "miss" : ""}"><span>${r.flag ? flagImg(r.flag, "miniflag") : ""}${esc(resultName(r))}</span><span class="d">${esc(resultDetail(r))}</span><span class="p ${r.miss ? "no" : "ok"}">${r.miss ? "✕" : "✓"}</span></li>`).join("")}</ul>
    </details>` : ""}
    ${a2hsShown ? a2hsCard() : ""}
    <div class="rfoot">
      ${playerName ? `<span>${t("playingAs", `<bdi>${esc(playerName)}</bdi>`)}</span><button id="rename">${t(USE_CONVEX ? "changeUser" : "changeName")}</button>` : `<button id="rename">${t(USE_CONVEX ? "addUser" : "addName")}</button>`}
      <button id="how2">${t("howToPlay")}</button>
    </div>
  </div>`;
  $("results").hidden = false;
  $("rename").onclick = () => askName(false);
  $("again").onclick = newGame;
  if (a2hsShown) wireA2hs();
  $("how2").onclick = showHelp;
  $("study") && ($("study").onclick = () => { $("results").hidden = true; setMode("explore"); });
  drawBoard();
}

/* ---------- first-visit tour ----------
   Three tips on the real controls, shown once after the welcome screen. Skippable at every step; replay from How to play. */
const TOUR_KEY = "globedrop-toured";
let tourWaiting = false;
const TOUR = [
  { el: () => document.querySelector(".modes"), h: "tour1h", p: "tour1p" },
  { el: () => $("m-explore"), h: "tour2h", p: "tour2p" },
  { el: () => document.querySelector(".meta"), h: "tour3h", p: "tour3p" },
];
let tourStep = -1;
function maybeTour(){
  let seen = false;
  try { seen = !!localStorage.getItem(TOUR_KEY); } catch(e){}
  if (!seen) afterSplash(() => { if (mode === "explore") tourWaiting = true; else setTimeout(startTour, 350); });
}
function startTour(){ tourStep = 0; $("tour").hidden = false; renderTourStep(); }
function endTour(){
  $("tour").hidden = true; tourStep = -1;
  try { localStorage.setItem(TOUR_KEY, "1"); } catch(e){}
}
function renderTourStep(){
  if (tourStep < 0) return;
  const step = TOUR[tourStep], last = tourStep === TOUR.length - 1;
  const tip = $("tour-tip");
  tip.innerHTML = `<h4 id="tour-h">${t(step.h)}</h4><p>${t(step.p)}</p>
    <div class="tour-foot">
      <span class="tour-dots" aria-label="${tourStep + 1} / ${TOUR.length}">${TOUR.map((_, i) => `<i class="${i === tourStep ? "on" : ""}"></i>`).join("")}</span>
      ${last ? "" : `<button class="tour-skip" id="tour-skip">${t("tourSkip")}</button>`}
      <button class="btn" id="tour-next">${last ? t("tourGo") : t("tourNext")}</button>
    </div>`;
  $("tour-next").onclick = () => { if (last) endTour(); else { tourStep++; renderTourStep(); } };
  if (!last) $("tour-skip").onclick = endTour;
  placeTour();
  $("tour-next").focus({preventScroll:true});
}
function placeTour(){
  if (tourStep < 0) return;
  const el = TOUR[tourStep].el(); if (!el) return endTour();
  const r = el.getBoundingClientRect(), pad = 6, vw = window.innerWidth, vh = window.innerHeight;
  const ring = $("tour-ring"), tip = $("tour-tip");
  Object.assign(ring.style, { left: (r.left - pad) + "px", top: (r.top - pad) + "px", width: (r.width + pad * 2) + "px", height: (r.height + pad * 2) + "px" });
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14;
  let top = r.bottom + pad + gap;
  if (top + th > vh - 12) top = Math.max(12, r.top - pad - gap - th); // no room below: sit above
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.min(Math.max(12, left), vw - tw - 12);
  Object.assign(tip.style, { left: left + "px", top: top + "px" });
}
window.addEventListener("resize", () => placeTour());
document.addEventListener("keydown", e => { if (!$("tour").hidden && e.key === "Escape") endTour(); });

const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function currentTheme(){

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });

/* When a new version of the page is published while someone is playing, the viewer swaps it in and hands back what
   snapshot() returned, so the game carries on (same mode, score, lives and streak) instead of starting over or sticking. */
window.claude?.hot?.snapshot?.(() => ({ mode, level, levelOf, results, lives, streak, inGame: !splashOpen }));
function boot(data){
  data = data || {};
  if (data.inGame){
    splashOpen = false; $("splash")?.remove();
    if (data.levelOf) Object.assign(levelOf, data.levelOf);
    if (data.mode && data.mode !== mode){ mode = data.mode; level = data.level || levelOf[mode] || "easy";
      for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).setAttribute("aria-pressed", mode === k);
      $("app").classList.toggle("exploring", mode === "explore"); paintLevel(); }
  }
  // a returning player reopens where they left off; a brand-new one starts on Flags
  if (!data.inGame){
    try {
      const lv = JSON.parse(localStorage.getItem(LEVELS_KEY) || "null"); if (lv) Object.assign(levelOf, lv);
      const m = localStorage.getItem(MODE_KEY);
      if (m && ["explore", "flags", "countries", "capitals", "cities"].includes(m)) mode = m;
      level = levelOf[mode] || "easy";
      for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).setAttribute("aria-pressed", mode === k);
      $("app").classList.toggle("exploring", mode === "explore"); paintLevel();
    } catch(e){}
  }
  if (mode === "explore") enterExplore(); else newGame();
  if (data.inGame && mode !== "explore" && Array.isArray(data.results)){
    results = data.results; lives = data.lives ?? LIVES; streak = data.streak || 0; renderTop();
  }
  layout();
  if (!data.inGame) maybeTour();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
document.fonts?.ready.then(() => { layout(); });
/* fade the splash once the game is drawn, but keep it at least a moment so the logo registers */
/* Splash: the logo pulses while the game loads, then a one-line tagline and a Play button appear.
   The game starts underneath; anything that should be seen first (the tour) waits until the player taps Play. */
/* The splash is the front door. New players: language, an optional name, Play. Returning players: a greeting and Play. */
let splashAsk = !playerName; // ask for a name only if this device doesn't know one
function renderSplash(){
  const body = $("spbody"); if (!body) return;
  let typed = $("spname") ? $("spname").value : "";
  if (!typed && USE_CONVEX){ try { typed = localStorage.getItem(NAME_KEY) || ""; } catch(e){} } // a name from before usernames: suggest it
  body.innerHTML = `${langPills()}
    ${splashAsk ? `<p class="sptag">${t("spTag")}</p>
      <form id="spform" autocomplete="off" novalidate>
        ${USE_CONVEX ? `<div class="namefield">${idFields("sp", typed)}
          <span class="hint">${t("userHint")}</span><div class="err" id="sperr"></div></div>` : `<div class="namefield"><label for="spname">${t("playerName")}</label>
          <input id="spname" type="text" maxlength="16" placeholder="${esc(t("placeholder"))}" value="${esc(typed)}" autocapitalize="words" spellcheck="false" enterkeyhint="go">
          <span class="hint">${t("spNameHint")}</span><div class="err" id="sperr"></div></div>`}
        <button class="btn spgo" id="spgo" type="submit">${t("spGo")}</button>
        <button class="btn2 spexplore" id="spexplore" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>${t("spExplore")}</button>
      </form>`
    : `<p class="sphi">${t("spHi", `<bdi>${esc(playerName)}</bdi>`)}</p><p class="sptag">${t("spTag")}</p>
      <button class="btn spgo" id="spgo" type="button">${t("spGo")}</button>
      <button class="btn2 spexplore" id="spexplore" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>${t("spExplore")}</button>
      <button class="linkbtn" id="spnotyou" type="button">${t(USE_CONVEX ? "spNotYouU" : "spNotYou")}</button>`}`;
  wireLangPills(body);
  $("spexplore").onclick = () => enterGame(true);
  if (splashAsk) $("spform").onsubmit = e => { e.preventDefault(); enterGame(); };
  else { $("spgo").onclick = enterGame; $("spnotyou").onclick = () => { splashAsk = true; renderSplash(); $("spname")?.focus(); }; }
}
let entering = false;
async function enterGame(toExplore){
  if (entering) return;
  if (splashAsk && USE_CONVEX){
    const raw = $("spname").value, pin = $("sppin").value;
    if (raw.trim() || pin){
      const b = $("spgo"); entering = true; b.setAttribute("aria-busy", "true"); b.textContent = t("checking");
      const err = lb.ready ? await claimUsername(raw, pin) : t("netErr");
      entering = false; b.removeAttribute("aria-busy"); b.textContent = t("spGo");
      if (err){ $("sperr").textContent = err; return; }
    }
  } else if (splashAsk && !USE_CONVEX){
    const raw = $("spname").value, n = cleanName(raw);
    if (raw.trim() && n.length < 2){ $("sperr").textContent = t("nameErr"); return; }
    if (n){ playerName = n; try { localStorage.setItem(NAME_KEY, n); } catch(e){} if (lb.ready && lb.mine) saveMine({}); }
  }
  if (toExplore === true) setMode("explore");
  const sp = $("splash");
  sp.classList.add("out"); splashOpen = false;
  setTimeout(() => { sp.remove(); afterSplashQueue.splice(0).forEach(f => f()); }, 450);
}
setTimeout(() => { if (!$("splash")) return; renderSplash(); $("splash").classList.add("ready"); }, Math.max(0, 900 - performance.now()));
// Enter starts the game from anywhere on the splash (except on the language buttons)
document.addEventListener("keydown", e => {
  if (!splashOpen || e.key !== "Enter" || !$("spgo") || e.target.closest?.(".langpills, #spnotyou")) return;
  e.preventDefault(); e.stopImmediatePropagation(); enterGame();
}, true);
if (window.ResizeObserver){ let lastH = 0; new ResizeObserver(() => { const h = $("top").offsetHeight; if (h !== lastH){ lastH = h; clearTimeout(rt); rt = setTimeout(layout, 60); } }).observe($("top")); }
</script>
