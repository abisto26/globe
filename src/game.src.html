  current = null; revealed = false; answerLL = null; guess = null; pickedF = null; area = null;
  stopTimer();
  $("app").classList.add("countries-mode");
  $("app").classList.remove("easy");
  $("levels").classList.add("off");
  paintCountries(); renderPrompt(); redrawMarks(); renderCard();
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity);
}
function exploreCountry(f){
  if (f.properties.name === "Antarctica") return;
  { const seen = new Set(readJSON(EXPLORED_KEY, [])); if (!seen.has(f.properties.name)){ seen.add(f.properties.name); try { localStorage.setItem(EXPLORED_KEY, JSON.stringify([...seen])); } catch(e){} bumpProg("explore", seen.size); } }
  current = f; revealed = true;
  answerLL = exploreFacts(f.properties.name).ll;
  paintCountries(); renderPrompt(); redrawMarks(); renderCard();
  focusBounds(safeBounds(mainShape(f)), 20, 0.6);
}
function renderExploreCard(c){
  c.classList.remove("stack");
  if (!current){
    c.innerHTML = `<div class="txt"><div class="small">${t("exploreHint")}</div>
      <button class="pracgo" id="pracgo"><span class="pi" aria-hidden="true">🎓</span><span class="pw"><b>${t("pracTitle")}</b><small>${t("pracSub")}</small></span><span class="chev" aria-hidden="true">›</span></button></div>`;
    onTap($("pracgo"), () => openRegions());
    return;
  }
  const n = current.properties.name, fx = exploreFacts(n), others = fx.cities;
  c.innerHTML = `<div class="excard txt">
      ${FLAGS[n] ? `<img class="exflag" src="${FLAGS[n]}" alt="">` : ""}
      <div class="exname">${esc(countryName(n))}</div>
      <dl>
        ${fx.capital ? `<dt>${t("capital")}</dt><dd>${esc(placeName(fx.capital))}</dd>` : ""}
        ${others.length ? `<dt>${t("bigCities")}</dt><dd class="cities">${others.map(x => esc(placeName(x))).join(LANG === "ar" ? "، " : ", ")}</dd>` : ""}
      </dl>
      ${fx.note ? `<div class="exnote">${esc(fx.note)}</div>` : ""}
      <div class="btns"><button class="btn2" id="worldview">${t("worldView")}</button></div>
    </div>`;
  $("worldview").onclick = enterExplore;
}

function paintLevel(){
  $("l-easy").setAttribute("aria-pressed", level === "easy");
  $("l-pro").setAttribute("aria-pressed", level === "pro");
}
const MODE_KEY = "globedrop-mode", LEVELS_KEY = "globedrop-levels";
function rememberMode(){ try { localStorage.setItem(MODE_KEY, mode); localStorage.setItem(LEVELS_KEY, JSON.stringify(levelOf)); } catch(e){} }
function setMode(m){
  if (m === mode) return;
  if (m === "explore"){ practicing = false; region = "world"; effCache = ""; } else lastGame = m;
  mode = m;
  rememberMode();
  if (m !== "explore" && tourWaiting){ tourWaiting = false; setTimeout(startTour, 500); }
  if (levelOf[m]) { level = levelOf[m]; paintLevel(); }
  for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).setAttribute("aria-pressed", m === k);
  $("app").classList.toggle("exploring", m === "explore");
  if (m === "explore") enterExplore(); else newGame();
  paintPracBar();
  layout(); // re-fit the map to the space this mode's card leaves free
}
function setLevel(l){
  if (l === level) return;
  level = l; levelOf[mode] = l;
  paintLevel(); rememberMode();
  newGame();
}
for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).onclick = () => setMode(k);
$("l-easy").onclick = () => setLevel("easy");
$("l-pro").onclick = () => setLevel("pro");
$("regpick").addEventListener("click", e => { if (e.target.id === "regpick") closeRegions(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("regpick").hidden) closeRegions(); });
if (mode !== "explore") lastGame = mode;

document.addEventListener("keydown", e => {
  if (!$("welcome").hidden) return;
  if (mode === "explore"){ if (e.key === "Escape" && current && $("help").hidden) enterExplore(); return; }
  if (isChoiceRound() && !revealed && /^[1-4]$/.test(e.key) && $("results").hidden && $("help").hidden){ pickCapital(choices[+e.key - 1]); return; }
  if (e.key === "Enter" || e.key === " "){
    if (!$("help").hidden) return;
    const b = $("again") && !$("results").hidden ? $("again") : ($("next") || $("lock"));
    if (b && !b.disabled && document.activeElement?.tagName !== "BUTTON"){ e.preventDefault(); b.click(); }
  }
});

/* ---------- first-visit tour ----------
   Three tips on the real controls, shown once after the welcome screen. Skippable at every step; replay from How to play. */
const TOUR_KEY = "globedrop-toured";
let tourWaiting = false;
const TOUR = [
  { el: () => document.querySelector(".modes"), h: "tour1h", p: "tour1p" },
  { el: () => $("m-explore"), h: "tour2h", p: "tour2p" },
  { el: () => document.querySelector(".meta"), h: "tour3h", p: "tour3p" },
];
let tourStep = -1;
function maybeTour(){
  let seen = false;
  try { seen = !!localStorage.getItem(TOUR_KEY); } catch(e){}
  if (!seen) afterSplash(() => { if (mode === "explore") tourWaiting = true; else setTimeout(startTour, 350); });
}
function startTour(){ tourStep = 0; $("tour").hidden = false; renderTourStep(); }
function endTour(){
  $("tour").hidden = true; tourStep = -1;
  try { localStorage.setItem(TOUR_KEY, "1"); } catch(e){}
}
function renderTourStep(){
  if (tourStep < 0) return;
  const step = TOUR[tourStep], last = tourStep === TOUR.length - 1;
  const tip = $("tour-tip");
  tip.innerHTML = `<h4 id="tour-h">${t(step.h)}</h4><p>${t(step.p)}</p>
    <div class="tour-foot">
      <span class="tour-dots" aria-label="${tourStep + 1} / ${TOUR.length}">${TOUR.map((_, i) => `<i class="${i === tourStep ? "on" : ""}"></i>`).join("")}</span>
      ${last ? "" : `<button class="tour-skip" id="tour-skip">${t("tourSkip")}</button>`}
      <button class="btn" id="tour-next">${last ? t("tourGo") : t("tourNext")}</button>
    </div>`;
  $("tour-next").onclick = () => { if (last) endTour(); else { tourStep++; renderTourStep(); } };
  if (!last) $("tour-skip").onclick = endTour;
  placeTour();
  $("tour-next").focus({preventScroll:true});
}
function placeTour(){
  if (tourStep < 0) return;
  const el = TOUR[tourStep].el(); if (!el) return endTour();
  const r = el.getBoundingClientRect(), pad = 6, vw = window.innerWidth, vh = window.innerHeight;
  const ring = $("tour-ring"), tip = $("tour-tip");
  Object.assign(ring.style, { left: (r.left - pad) + "px", top: (r.top - pad) + "px", width: (r.width + pad * 2) + "px", height: (r.height + pad * 2) + "px" });
  const tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14;
  let top = r.bottom + pad + gap;
  if (top + th > vh - 12) top = Math.max(12, r.top - pad - gap - th); // no room below: sit above
  let left = r.left + r.width / 2 - tw / 2;
  left = Math.min(Math.max(12, left), vw - tw - 12);
  Object.assign(tip.style, { left: left + "px", top: top + "px" });
}
window.addEventListener("resize", () => placeTour());
document.addEventListener("keydown", e => { if (!$("tour").hidden && e.key === "Escape") endTour(); });

/* ---------- how to play ---------- */
function showHelp(){
  $("help").innerHTML = `<div class="sheet" role="dialog" aria-labelledby="help-t">
    <button class="grab" id="helpgrab" aria-label="${esc(t("lbClose"))}"></button>
    <h3 id="help-t">${t("howToPlay")}</h3>
    <h4 class="hh">${t("hRules")}</h4>
    <ul class="hrules">${["r_score", "r_lives", "r_time", "r_back"].map(k => `<li>${t(k)}</li>`).join("")}</ul>
    <h4 class="hh">${t("hGames")}</h4>
    <dl class="hgames">${["flags", "countries", "capitals", "cities", "explore"].map(k => `<dt>${t("m_" + k)}</dt><dd>${t("g_" + k)}</dd>`).join("")}</dl>
    ${isStandalone ? "" : `<details class="helpa2hs"><summary>${t("a2hsHelp")}</summary><p><b>iPhone:</b> ${t("a2hsIOS")}</p><p><b>Android:</b> ${t("a2hsAndroid")}</p></details>`}
    <button class="btn" id="help-ok">${t("gotIt")}</button>
    <button class="linkbtn" id="help-tour">${t("tourAgain")}</button>
  </div>`;
  $("help").hidden = false;
  $("help-ok").onclick = closeHelp; onTap($("helpgrab"), closeHelp);
  $("help-tour").onclick = () => { closeHelp(); $("results").hidden = true; if (mode === "explore") setMode("flags"); startTour(); };
  $("help-ok").focus({preventScroll:true});
}
function closeHelp(){ $("help").hidden = true; }
$("how").onclick = showHelp;
$("help").addEventListener("click", e => { if (e.target.id === "help") closeHelp(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (!$("help").hidden) closeHelp(); closeLangMenu(); } });

/* ---------- language switch ---------- */
/* the game's name as a logo: Arabic, Russian, or "Globe" for the other languages */
const BADGE_WORLD = "__BADGE_WORLD__";
/* Abisto's badge artwork; achievements without one yet keep their emoji */
const BADGE_IMG = { world: BADGE_WORLD, fire: "__BADGE_FIRE__", allround: "__BADGE_ALLROUND__", days: "__BADGE_DAILY__", light: "__BADGE_LIGHT__", bull: "__BADGE_BULL__", explore: "__BADGE_EXPLORE__", champ: "__BADGE_CHAMP__", pro: "__BADGE_PRO__", cont: "__BADGE_CONT__", langs: "__BADGE_LANGS__", untouch: "__BADGE_UNTOUCH__" };
const WORDMARK = { en: "__WORD_EN__", ar: "__WORD_AR__", ru: "__WORD_RU__" };
/* as big as the header allows: full size, then two smaller steps, then hidden if the tabs need the room */
function fitBrand(){
  const b = document.querySelector(".brand"), m = document.querySelector(".headrow .modes"); if (!b || !m) return;
  const rtl = document.documentElement.dir === "rtl";
  const fits = () => { const r = b.getBoundingClientRect(), mr = m.getBoundingClientRect();
    return m.scrollWidth <= m.clientWidth + 1 && (rtl ? r.left >= mr.right + 6 : r.right <= mr.left - 6); };
  for (const c of ["", "s1", "s2", "tight"]){
    b.classList.remove("s1", "s2", "tight"); if (c) b.classList.add(c);
    if (c === "tight" || fits()) return;
  }
}
$("bword").addEventListener("load", () => fitBrand());
addEventListener("resize", () => requestAnimationFrame(fitBrand));
function applyStatic(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $("langbtn").querySelector("span").textContent = LANG.toUpperCase();
  { const w = $("bword"), src = WORDMARK[LANG] || WORDMARK.en; if (w.getAttribute("src") !== src) w.src = src; w.alt = t("appName"); }
  requestAnimationFrame(fitBrand);
  $("langmenu").innerHTML = Object.entries(LANGS).map(([k, v]) => `<button type="button" role="menuitemradio" aria-checked="${k === LANG}" data-lang="${k}" lang="${k}">${v}</button>`).join("");
  wireLangPills($("langmenu"));
  paintThemeBtn?.();
}
function setLang(l){
  if (splashOpen) setTimeout(renderSplash, 0);
  if (!LANGS[l]) return;
  LANG = l;
  try { localStorage.setItem("globedrop-lang", l); } catch(e){}
  closeLangMenu();
  applyStatic();
  renderPrompt(); renderTop(); redrawMarks(); renderCard(false);
  if (!$("results").hidden) renderResults();
  if (!$("help").hidden) showHelp();
  if (!$("welcome").hidden) askName(welcomeFirst);
  if (!$("tour").hidden) renderTourStep();
  paintPracBar(); if (!$("regpick").hidden) openRegions(pickMode);
}
function closeLangMenu(){ $("langmenu").hidden = true; $("langbtn").setAttribute("aria-expanded", "false"); }
$("langbtn").onclick = e => {
  e.stopPropagation();
  const open = $("langmenu").hidden;
  $("langmenu").hidden = !open; $("langbtn").setAttribute("aria-expanded", String(open));
};
document.addEventListener("click", e => { if (!e.target.closest?.(".langwrap")) closeLangMenu(); });

/* ---------- theme ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function currentTheme(){
  const th = document.documentElement.dataset.theme;
  if (th === "dark" || th === "light") return th;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintThemeBtn(){
  const dark = currentTheme() === "dark";
  $("theme").innerHTML = dark ? SUN : MOON;
  $("theme").setAttribute("aria-label", dark ? t("toLight") : t("toDark"));
}
try { const saved = localStorage.getItem("globedrop-theme"); if (saved) document.documentElement.dataset.theme = saved; } catch(e){}
$("theme").onclick = () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("globedrop-theme", next); } catch(e){}
  paintThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);

applyStatic();
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(layout, 120); });
layout();
/* When a new version of the page is published while someone is playing, the viewer swaps it in and hands back what
   snapshot() returned, so the game carries on (same mode, score, lives and streak) instead of starting over or sticking. */
window.claude?.hot?.snapshot?.(() => ({ mode, level, levelOf, results, lives, streak, inGame: !splashOpen }));
function boot(data){
  data = data || {};
  if (data.inGame){
    splashOpen = false; $("splash")?.remove();
    if (data.levelOf) Object.assign(levelOf, data.levelOf);
    if (data.mode && data.mode !== mode){ mode = data.mode; level = data.level || levelOf[mode] || "easy";
      for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).setAttribute("aria-pressed", mode === k);
      $("app").classList.toggle("exploring", mode === "explore"); paintLevel(); }
  }
  // a returning player reopens where they left off; a brand-new one starts on Flags
  if (!data.inGame){
    try {
      const lv = JSON.parse(localStorage.getItem(LEVELS_KEY) || "null"); if (lv) Object.assign(levelOf, lv);
      const m = localStorage.getItem(MODE_KEY);
      if (m && ["explore", "flags", "countries", "capitals", "cities"].includes(m)) mode = m;
      level = levelOf[mode] || "easy";
      for (const k of ["explore", "flags", "countries", "capitals", "cities"]) $("m-" + k).setAttribute("aria-pressed", mode === k);
      $("app").classList.toggle("exploring", mode === "explore"); paintLevel();
    } catch(e){}
  }
  if (mode === "explore") enterExplore(); else newGame();
  if (data.inGame && mode !== "explore" && Array.isArray(data.results)){
    results = data.results; lives = data.lives ?? LIVES; streak = data.streak || 0; renderTop();
  }
  layout();
  pendingChallenge = readChallenge();
  if (pendingChallenge){
    try { history.replaceState(null, "", location.pathname + location.hash); } catch(e){}
    const ch = pendingChallenge; pendingChallenge = null;
    try { localStorage.setItem(TOUR_KEY, "1"); } catch(e){} // a friend's link goes straight to the challenge
    afterSplash(() => setTimeout(() => showInvite(ch), 250));
  } else if (!data.inGame) maybeTour();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
document.fonts?.ready.then(() => { layout(); });
/* fade the splash once the game is drawn, but keep it at least a moment so the logo registers */
/* Splash: the logo pulses while the game loads, then a one-line tagline and a Play button appear.
   The game starts underneath; anything that should be seen first (the tour) waits until the player taps Play. */
/* The splash is the front door. New players: language, an optional name, Play. Returning players: a greeting and Play. */
let splashAsk = !playerName; // ask for a name only if this device doesn't know one
function renderSplash(){
  const body = $("spbody"); if (!body) return;
  let typed = $("spname") ? $("spname").value : "";
  if (!typed && USE_CONVEX){ try { typed = localStorage.getItem(NAME_KEY) || ""; } catch(e){} } // a name from before usernames: suggest it
  body.innerHTML = `${langPills()}
    ${splashAsk ? `<p class="sptag">${t("spTag")}</p>
      <form id="spform" autocomplete="off" novalidate>
        ${USE_CONVEX ? `<div class="namefield">${idFields("sp", typed)}
          <span class="hint">${t("userHint")}</span><div class="err" id="sperr"></div></div>` : `<div class="namefield"><label for="spname">${t("playerName")}</label>
          <input id="spname" type="text" maxlength="16" placeholder="${esc(t("placeholder"))}" value="${esc(typed)}" autocapitalize="words" spellcheck="false" enterkeyhint="go">
          <span class="hint">${t("spNameHint")}</span><div class="err" id="sperr"></div></div>`}
        <button class="btn spgo" id="spgo" type="submit">${t("spGo")}</button>
        <button class="btn2 spexplore" id="spexplore" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>${t("spExplore")}</button>
      </form>`
    : `<p class="sphi">${t("spHi", `<bdi>${esc(playerName)}</bdi>`)}</p><p class="sptag">${t("spTag")}</p>
      <button class="btn spgo" id="spgo" type="button">${t("spGo")}</button>
      <button class="btn2 spexplore" id="spexplore" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z" fill="currentColor"/></svg>${t("spExplore")}</button>
      <button class="linkbtn" id="spnotyou" type="button">${t(USE_CONVEX ? "spNotYouU" : "spNotYou")}</button>`}`;
  wireLangPills(body);
  $("spexplore").onclick = () => enterGame(true);
  if (splashAsk) $("spform").onsubmit = e => { e.preventDefault(); enterGame(); };
  else { $("spgo").onclick = enterGame; $("spnotyou").onclick = () => { splashAsk = true; renderSplash(); $("spname")?.focus(); }; }
}
let entering = false;
async function enterGame(toExplore){
  if (entering) return;
  if (splashAsk && USE_CONVEX){
    const raw = $("spname").value, pin = $("sppin").value;
    if (raw.trim() || pin){
      const b = $("spgo"); entering = true; b.setAttribute("aria-busy", "true"); b.textContent = t("checking");
      const err = lb.ready ? await claimUsername(raw, pin) : !isOffline ? t("netErr") : t("offUser");
      entering = false; b.removeAttribute("aria-busy"); b.textContent = t("spGo");
      if (err){ $("sperr").textContent = err; return; }
    }
  } else if (splashAsk && !USE_CONVEX){
    const raw = $("spname").value, n = cleanName(raw);
    if (raw.trim() && n.length < 2){ $("sperr").textContent = t("nameErr"); return; }
    if (n){ playerName = n; try { localStorage.setItem(NAME_KEY, n); } catch(e){} if (lb.ready && lb.mine) saveMine({}); }
  }
  if (toExplore === true) setMode("explore");
  const sp = $("splash");
  sp.classList.add("out"); splashOpen = false;
  setTimeout(() => { sp.remove(); afterSplashQueue.splice(0).forEach(f => f()); }, 450);
}
setTimeout(() => { if (!$("splash")) return; renderSplash(); $("splash").classList.add("ready"); }, Math.max(0, 900 - performance.now()));
// Enter starts the game from anywhere on the splash (except on the language buttons)
document.addEventListener("keydown", e => {
  if (!splashOpen || e.key !== "Enter" || !$("spgo") || e.target.closest?.(".langpills, #spnotyou")) return;
  e.preventDefault(); e.stopImmediatePropagation(); enterGame();
}, true);
if (window.ResizeObserver){ let lastH = 0; new ResizeObserver(() => { const h = $("top").offsetHeight; if (h !== lastH){ lastH = h; clearTimeout(rt); rt = setTimeout(layout, 60); } }).observe($("top")); }
</script>
